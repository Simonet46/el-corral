<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Corral — Gestión del establo de Matías</title>

<style>
  :root {
    --ground: #EEF1EB;
    --surface: #FBFCF8;
    --surface-2: #E5EAE1;
    --surface-3: #DBE1D6;
    --ink: #14201A;
    --ink-soft: #384840;
    --muted: #5E6E64;
    --faint: #8C998F;
    --rule: #D3DBCF;
    --rule-soft: #E2E7DE;
    --accent: #1E5A3F;
    --accent-ink: #FBFCF8;
    --accent-soft: #DBE8DE;
    --brass: #8A6C22;
    --brass-soft: #F0E6CB;
    --shadow: 0 1px 2px rgba(20,32,26,.06), 0 6px 18px rgba(20,32,26,.05);

    --st-comp: #C08A12;
    --st-juego: #2F7A4E;
    --st-prep: #3B7595;
    --st-recup: #AE4530;
    --st-vientre: #7E5795;
    --st-prestada: #61756A;
    --st-retirada: #8A8371;
    --st-baja: #55605A;

    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Avenir Next", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0E1411; --surface: #151C18; --surface-2: #1C2520; --surface-3: #243029;
      --ink: #E8EDE6; --ink-soft: #C5CEC7; --muted: #93A197; --faint: #6E7C73;
      --rule: #26312B; --rule-soft: #1E2822;
      --accent: #74C295; --accent-ink: #0E1411; --accent-soft: #1B2E24;
      --brass: #D6B064; --brass-soft: #2B2417;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
      --st-comp: #E0B44B; --st-juego: #6ABF8B; --st-prep: #6FAACD; --st-recup: #DE8168;
      --st-vientre: #B58FC9; --st-prestada: #93A79B; --st-retirada: #BBB29A; --st-baja: #7E8A83;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0E1411; --surface: #151C18; --surface-2: #1C2520; --surface-3: #243029;
    --ink: #E8EDE6; --ink-soft: #C5CEC7; --muted: #93A197; --faint: #6E7C73;
    --rule: #26312B; --rule-soft: #1E2822;
    --accent: #74C295; --accent-ink: #0E1411; --accent-soft: #1B2E24;
    --brass: #D6B064; --brass-soft: #2B2417;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    --st-comp: #E0B44B; --st-juego: #6ABF8B; --st-prep: #6FAACD; --st-recup: #DE8168;
    --st-vientre: #B58FC9; --st-prestada: #93A79B; --st-retirada: #BBB29A; --st-baja: #7E8A83;
  }
  :root[data-theme="light"] {
    --ground: #EEF1EB; --surface: #FBFCF8; --surface-2: #E5EAE1; --surface-3: #DBE1D6;
    --ink: #14201A; --ink-soft: #384840; --muted: #5E6E64; --faint: #8C998F;
    --rule: #D3DBCF; --rule-soft: #E2E7DE;
    --accent: #1E5A3F; --accent-ink: #FBFCF8; --accent-soft: #DBE8DE;
    --brass: #8A6C22; --brass-soft: #F0E6CB;
    --shadow: 0 1px 2px rgba(20,32,26,.06), 0 6px 18px rgba(20,32,26,.05);
    --st-comp: #C08A12; --st-juego: #2F7A4E; --st-prep: #3B7595; --st-recup: #AE4530;
    --st-vientre: #7E5795; --st-prestada: #61756A; --st-retirada: #8A8371; --st-baja: #55605A;
  }

  * { box-sizing: border-box; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 15.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  p { margin: 0; }
  h1,h2,h3,h4 { margin: 0; }
  ul { margin: 0; padding-left: 1.1rem; }
  img { max-width: 100%; display: block; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  /* ---------- topbar ---------- */
  .top { position: sticky; top: 0; z-index: 40; background: var(--surface); border-bottom: 1px solid var(--rule); }
  .top-in { max-width: 78rem; margin: 0 auto; padding: .6rem clamp(.7rem,2.5vw,1.4rem); display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: .5rem; margin-right: auto; }
  .brand b { font-family: var(--serif); font-weight: 400; font-size: 1.3rem; letter-spacing: -.01em; }
  .brand span { font-family: var(--mono); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .search { position: relative; flex: 1 1 15rem; min-width: 11rem; }
  .search input { width: 100%; padding: .48rem .7rem .48rem 1.9rem; background: var(--ground); border: 1px solid var(--rule); border-radius: 4px; font-size: .92rem; }
  .search .ico { position: absolute; left: .55rem; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: .9rem; }
  .search kbd { position: absolute; right: .45rem; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: .6rem; color: var(--faint); border: 1px solid var(--rule); border-radius: 3px; padding: 0 .25rem; }
  .cur-toggle { display: flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
  .cur-toggle button { background: var(--ground); border: 0; padding: .35rem .55rem; font-family: var(--mono); font-size: .68rem; letter-spacing: .06em; color: var(--muted); cursor: pointer; }
  .cur-toggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  .tabs { border-bottom: 1px solid var(--rule); background: var(--surface); position: sticky; top: 3.1rem; z-index: 39; }
  .tabs-in { max-width: 78rem; margin: 0 auto; padding: 0 clamp(.7rem,2.5vw,1.4rem); display: flex; gap: .1rem; overflow-x: auto; }
  .tabs a { display: block; padding: .55rem .8rem; font-size: .88rem; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs a:hover { color: var(--ink); }
  .tabs a.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

  main { max-width: 78rem; margin: 0 auto; padding: clamp(1rem,3vw,2rem) clamp(.7rem,2.5vw,1.4rem) 5rem; display: flex; flex-direction: column; gap: 1.6rem; }

  /* ---------- primitivas ---------- */
  .eyebrow { font-family: var(--mono); font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .h-sec { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .h-sec h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(1.35rem,3vw,1.75rem); letter-spacing: -.015em; }
  .sub { color: var(--muted); font-size: .9rem; }
  .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow); }
  .pad { padding: clamp(.9rem,2vw,1.25rem); }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1; }
  .stack { display: flex; flex-direction: column; gap: .9rem; }

  .btn { background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: .42rem .8rem; font-size: .88rem; cursor: pointer; display: inline-flex; align-items: center; gap: .35rem; text-decoration: none; color: var(--ink); }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--st-recup); border-color: var(--st-recup); background: transparent; }
  .btn.sm { padding: .25rem .55rem; font-size: .78rem; }

  .pill { display: inline-flex; align-items: center; gap: .3rem; font-family: var(--mono); font-size: .64rem; letter-spacing: .05em; text-transform: uppercase; padding: .18rem .45rem; border-radius: 3px; white-space: nowrap; border: 1px solid transparent; }
  .pill .dotc { width: .5rem; height: .5rem; border-radius: 50%; background: currentColor; }
  .pill.warn { background: var(--brass-soft); color: var(--brass); }
  .pill.crit { background: color-mix(in srgb, var(--st-recup) 16%, transparent); color: var(--st-recup); }
  .pill.ok { background: var(--accent-soft); color: var(--accent); }
  .pill.flat { background: var(--surface-2); color: var(--muted); }

  .field { display: flex; flex-direction: column; gap: .22rem; }
  .field > label { font-family: var(--mono); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .field input, .field select, .field textarea { width: 100%; padding: .42rem .55rem; background: var(--ground); border: 1px solid var(--rule); border-radius: 4px; font-size: .92rem; }
  .field textarea { min-height: 4.5rem; resize: vertical; font-family: inherit; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .8rem; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: .8rem; }

  .scroller { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--rule-soft); }
  thead th { font-family: var(--mono); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 500; background: var(--surface-2); border-bottom: 1px solid var(--rule); white-space: nowrap; position: sticky; top: 0; }
  tbody tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: var(--surface-2); }

  .empty { text-align: center; padding: 2.5rem 1rem; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: .8rem; }
  .empty h3 { font-family: var(--serif); font-weight: 400; font-size: 1.4rem; color: var(--ink); }

  /* ---------- tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
  .tile { background: var(--surface); padding: .8rem .9rem .9rem; display: flex; flex-direction: column; gap: .12rem; }
  .tile .k { font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .tile .v { font-family: var(--serif); font-size: 1.85rem; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .tile .s { font-size: .76rem; color: var(--muted); }
  .tile.alert .v { color: var(--st-recup); }
  .tile.money .v { color: var(--brass); }

  /* ---------- corral ---------- */
  .corral-wrap { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; }
  .corral-head { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; padding: .7rem .9rem; border-bottom: 1px solid var(--rule); background: var(--surface-2); }
  .corral-head .eyebrow { margin-right: auto; }
  .corral { padding: 1.4rem 1rem; display: flex; flex-wrap: wrap; gap: .55rem; align-items: center; justify-content: center; background:
     radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 60%); }
  .dot { border: 0; padding: 0; border-radius: 50%; cursor: pointer; position: relative; display: grid; place-items: center;
         font-family: var(--mono); font-size: .58rem; font-weight: 700; color: #fff; letter-spacing: 0;
         transition: transform .12s ease, box-shadow .12s ease; }
  .dot:hover, .dot:focus-visible { transform: scale(1.28); z-index: 5; box-shadow: 0 4px 14px rgba(0,0,0,.28); }
  .dot.comp { box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 4.5px var(--st-comp); }
  .dot.comp:hover { box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 4.5px var(--st-comp), 0 4px 14px rgba(0,0,0,.28); }
  .dot.baja { opacity: .4; }
  .dot.baja::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(45deg, transparent 46%, var(--surface) 46%, var(--surface) 54%, transparent 54%); }
  .segm { display: flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
  .segm button { background: var(--surface); border: 0; border-right: 1px solid var(--rule); padding: .25rem .55rem; font-size: .76rem; color: var(--muted); cursor: pointer; }
  .segm button:last-child { border-right: 0; }
  .segm button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

  .potreros { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1px; background: var(--rule); }
  .potrero { background: var(--surface); display: flex; flex-direction: column; }
  .pot-head { display: flex; align-items: center; gap: .4rem; padding: .5rem .75rem; border-bottom: 1px dashed var(--rule); }
  .pot-head .sw { width: .6rem; height: .6rem; border-radius: 50%; flex: none; }
  .pot-t { font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
  .pot-n { font-family: var(--serif); font-size: 1.05rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pot-d { font-size: .7rem; color: var(--faint); margin-left: auto; text-align: right; }
  .pot-body { padding: .9rem .75rem 1.1rem; display: flex; flex-wrap: wrap; gap: .45rem; align-content: flex-start; min-height: 4.5rem;
    background: repeating-linear-gradient(90deg, transparent 0 11px, color-mix(in srgb, var(--rule) 45%, transparent) 11px 12px); }

  .legend { display: flex; flex-wrap: wrap; gap: .35rem .9rem; padding: .7rem .9rem; border-top: 1px solid var(--rule); background: var(--surface-2); font-size: .76rem; color: var(--muted); }
  .legend .li { display: inline-flex; align-items: center; gap: .35rem; }
  .legend .sw { width: .7rem; height: .7rem; border-radius: 50%; }
  .tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--ground); padding: .45rem .6rem; border-radius: 4px; font-size: .78rem; line-height: 1.35; max-width: 15rem; box-shadow: 0 6px 20px rgba(0,0,0,.25); opacity: 0; transition: opacity .1s; }
  .tip.on { opacity: 1; }
  .tip b { font-family: var(--serif); font-weight: 400; font-size: .95rem; }
  .tip .m { font-family: var(--mono); font-size: .66rem; color: var(--brass); letter-spacing: .06em; text-transform: uppercase; }

  /* ---------- lista de caballos ---------- */
  .filters { display: flex; gap: .45rem; flex-wrap: wrap; align-items: center; }
  .filters select { padding: .32rem .5rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; font-size: .82rem; }
  .chk { display: inline-flex; align-items: center; gap: .3rem; font-size: .82rem; color: var(--muted); }

  .hlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: .8rem; }
  .hcard { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; text-decoration: none; color: inherit; display: flex; flex-direction: column; box-shadow: var(--shadow); transition: transform .12s ease, border-color .12s; }
  .hcard:hover { transform: translateY(-2px); border-color: var(--accent); }
  .hcard .ph { aspect-ratio: 4/3; background: var(--surface-2); position: relative; overflow: hidden; display: grid; place-items: center; }
  .hcard .ph img { width: 100%; height: 100%; object-fit: cover; }
  .hcard .ph .noimg { font-family: var(--serif); font-size: 2.2rem; color: var(--faint); }
  .hcard .ph .badge { position: absolute; left: .5rem; top: .5rem; }
  .hcard .bd { padding: .65rem .75rem .8rem; display: flex; flex-direction: column; gap: .3rem; }
  .hcard .nm { font-family: var(--serif); font-size: 1.15rem; line-height: 1.15; }
  .hcard .mt { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hcard .ap { font-family: var(--mono); font-size: .68rem; color: var(--brass); }

  /* ---------- ficha ---------- */
  .ficha-top { display: grid; grid-template-columns: minmax(0,1fr); gap: 1.2rem; }
  @media (min-width: 46rem) { .ficha-top { grid-template-columns: 20rem minmax(0,1fr); } }
  .gal { display: flex; flex-direction: column; gap: .5rem; }
  .gal .main { aspect-ratio: 4/3; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; display: grid; place-items: center; }
  .gal .main img { width: 100%; height: 100%; object-fit: cover; }
  .gal .thumbs { display: flex; gap: .4rem; flex-wrap: wrap; }
  .gal .thumbs button { width: 3.4rem; height: 3.4rem; padding: 0; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; background: var(--surface-2); cursor: pointer; }
  .gal .thumbs button[aria-current="true"] { border-color: var(--accent); border-width: 2px; }
  .gal .thumbs img { width: 100%; height: 100%; object-fit: cover; }

  .ficha-name { font-family: var(--serif); font-weight: 400; font-size: clamp(2rem,5vw,2.9rem); line-height: 1; letter-spacing: -.02em; }
  .ficha-sub { color: var(--muted); font-size: .95rem; }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem,1fr)); gap: .8rem 1.2rem; }
  .kv .k { font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .kv .v { font-size: .95rem; }

  .apt { display: flex; flex-direction: column; gap: .45rem; }
  .apt .r { display: grid; grid-template-columns: 7.5rem 1fr 1.8rem; gap: .6rem; align-items: center; }
  .apt .lb { font-size: .85rem; color: var(--ink-soft); }
  .apt .bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .apt .bar span { display: block; height: 100%; background: var(--accent); }
  .apt .n { font-family: var(--mono); font-size: .8rem; text-align: right; font-variant-numeric: tabular-nums; }
  .score-big { display: flex; align-items: baseline; gap: .4rem; }
  .score-big .n { font-family: var(--serif); font-size: 2.6rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .score-big .d { color: var(--muted); font-size: .85rem; }

  .prize { color: var(--brass); font-family: var(--mono); font-size: .72rem; }
  .price-box { background: var(--brass-soft); border: 1px solid color-mix(in srgb, var(--brass) 35%, transparent); border-radius: 6px; padding: .8rem 1rem; display: flex; flex-direction: column; gap: .15rem; }
  .price-box .k { font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--brass); }
  .price-box .v { font-family: var(--serif); font-size: 1.9rem; line-height: 1.05; font-variant-numeric: tabular-nums; }

  .rel { display: flex; flex-wrap: wrap; gap: .4rem; }
  .rel a { display: inline-flex; align-items: center; gap: .35rem; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 999px; padding: .2rem .6rem .2rem .3rem; font-size: .82rem; text-decoration: none; color: var(--ink); }
  .rel a:hover { border-color: var(--accent); }
  .rel .sw { width: .6rem; height: .6rem; border-radius: 50%; }

  .timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .tl { display: grid; grid-template-columns: 6.2rem minmax(0,1fr) minmax(0,1fr); gap: .3rem .9rem; align-items: baseline;
        padding: .5rem 0 .5rem 1rem; border-left: 2px solid var(--rule); position: relative; }
  .tl::before { content: ""; position: absolute; left: -5px; top: .95rem; width: 8px; height: 8px; border-radius: 50%; background: var(--rule); }
  .tl.now { border-left-color: var(--accent); }
  .tl.now::before { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .tl-f { font-family: var(--mono); font-size: .78rem; color: var(--muted); }
  .tl-r { font-size: .92rem; }
  .tl-a { color: var(--accent); padding: 0 .15rem; }
  .tl-m { font-size: .82rem; color: var(--muted); }
  @media (max-width: 40rem) { .tl { grid-template-columns: 1fr; gap: .1rem; } }

  .alerts { display: flex; flex-direction: column; gap: .4rem; }
  .alert-row { display: flex; gap: .5rem; align-items: center; padding: .45rem .6rem; border-radius: 4px; background: var(--surface-2); font-size: .87rem; }
  .alert-row.crit { background: color-mix(in srgb, var(--st-recup) 12%, transparent); }
  .alert-row.warn { background: var(--brass-soft); }

  /* ---------- form ---------- */
  .fs { border: 1px solid var(--rule); border-radius: 6px; padding: 1rem; background: var(--surface); display: flex; flex-direction: column; gap: .9rem; }
  .fs > legend { font-family: var(--mono); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); padding: 0 .4rem; }
  .rowset { display: flex; flex-direction: column; gap: .45rem; }
  .rowset .rw { display: grid; grid-template-columns: repeat(auto-fit, minmax(6rem,1fr)) 2rem; gap: .4rem; align-items: end; }
  .rowset .rw .del { border: 1px solid var(--rule); background: var(--surface); border-radius: 4px; cursor: pointer; height: 2rem; color: var(--muted); }
  .rowset .rw .del:hover { color: var(--st-recup); border-color: var(--st-recup); }
  .photos { display: flex; gap: .5rem; flex-wrap: wrap; }
  .photos .p { position: relative; width: 5rem; height: 5rem; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
  .photos .p img { width: 100%; height: 100%; object-fit: cover; }
  .photos .p button { position: absolute; right: .15rem; top: .15rem; width: 1.2rem; height: 1.2rem; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; font-size: .7rem; line-height: 1; cursor: pointer; }
  .vgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: .8rem; }
  .vfig { margin: 0; display: flex; flex-direction: column; gap: .3rem; }
  .vfig video { width: 100%; aspect-ratio: 16/9; border-radius: 6px; background: #000; }

  .slider-row { display: grid; grid-template-columns: 7.5rem 1fr 1.6rem; gap: .6rem; align-items: center; }
  .slider-row input[type=range] { width: 100%; accent-color: var(--accent); }
  .slider-row .n { font-family: var(--mono); font-size: .82rem; text-align: right; }

  .bar-meter { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .bar-meter span { display: block; height: 100%; background: var(--accent); }
  .bar-meter.warn span { background: var(--brass); }
  .bar-meter.crit span { background: var(--st-recup); }

  .toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%) translateY(1rem); background: var(--ink); color: var(--ground); padding: .55rem 1rem; border-radius: 5px; font-size: .87rem; box-shadow: 0 8px 24px rgba(0,0,0,.3); opacity: 0; transition: all .18s ease; z-index: 80; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  .aviso { background: var(--brass-soft); border: 1px solid color-mix(in srgb, var(--brass) 40%, transparent);
           border-left-width: 3px; border-radius: 5px; padding: .7rem .9rem; font-size: .88rem; color: var(--ink-soft); }
  .aviso strong { color: var(--brass); }

  .note { font-size: .8rem; color: var(--muted); }
  .mono { font-family: var(--mono); }
  .tnum { font-variant-numeric: tabular-nums; }

  @media print {
    .top, .tabs, .no-print { display: none !important; }
    body { background: #fff; color: #000; }
    main { padding: 0; max-width: none; }
    .card, .fs { box-shadow: none; border-color: #bbb; break-inside: avoid; }
    .cost { display: none !important; }
  }
</style>

<main id="app"></main>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ============ constantes de dominio ============ */

  var KEY = "elcorral.v1";

  var ESTADOS = [
    { id: "competicion", label: "Competición",   color: "var(--st-comp)",     desc: "Juega torneos esta temporada" },
    { id: "juego",       label: "En juego",      color: "var(--st-juego)",    desc: "Trabajando y disponible" },
    { id: "preparacion", label: "Preparación",   color: "var(--st-prep)",     desc: "Potro, doma o primer año" },
    { id: "recuperacion",label: "Recuperación",  color: "var(--st-recup)",    desc: "Lesionada o en reposo" },
    { id: "vientre",     label: "Vientre / haras", color: "var(--st-vientre)",desc: "Madre en el haras" },
    { id: "prestada",    label: "Prestada",      color: "var(--st-prestada)", desc: "En otro establecimiento" },
    { id: "retirada",    label: "Retirada",      color: "var(--st-retirada)", desc: "Ya no juega, sigue en el campo" },
    { id: "baja",        label: "Fallecida / vendida", color: "var(--st-baja)", desc: "Fuera del conjunto" }
  ];

  var RUBROS = ["Alimentación", "Veterinaria", "Herrería", "Pensión / campo", "Transporte", "Personal", "Seguro", "Torneos", "Reproducción", "Otros"];
  var APTITUDES = [
    { id: "velocidad", label: "Velocidad" },
    { id: "boca", label: "Boca" },
    { id: "freno", label: "Freno y giro" },
    { id: "temperamento", label: "Temperamento" },
    { id: "resistencia", label: "Resistencia" },
    { id: "recuperacion", label: "Recuperación" }
  ];
  var SEXOS = ["Yegua", "Padrillo", "Castrado", "Potranca", "Potrillo"];
  var HEMBRAS = ["Yegua", "Potranca"];

  /* ============ estado ============ */

  var db = load();
  var ui = { q: "", cur: "USD", galIdx: 0, corralModo: "estado", moviendo: null, editandoTemp: null, filtros: { estado: "", ubicacion: "", sexo: "", incluirBajas: false } };

  function defaults() {
    return { horses: [], temporadas: [], settings: { fx: 1000, moneda: "USD" }, v: 2 };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return defaults();
      var d = JSON.parse(raw);
      if (!d || !Array.isArray(d.horses)) return defaults();
      if (!d.settings) d.settings = { fx: 1000, moneda: "USD" };
      if (!Array.isArray(d.temporadas)) d.temporadas = [];
      d.horses.forEach(function (h) { if (!Array.isArray(h.movimientos)) h.movimientos = []; });
      var mapaOrigen = { "Criado propio": "Manada (cría propia)", "Embrión": "Embrión (cría propia)", "Clon": "Embrión (cría propia)", "Recibido": "" };
      d.horses.forEach(function (h) { if (mapaOrigen.hasOwnProperty(h.origen)) h.origen = mapaOrigen[h.origen]; });
      return d;
    } catch (e) { return defaults(); }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(db));
      return true;
    } catch (e) {
      if (e && (e.name === "QuotaExceededError" || e.code === 22 || e.code === 1014)) {
        toast("No entra más: se llenó el espacio del navegador. Exportá el respaldo y sacá algunas fotos.");
      } else {
        toast("Vista previa: los cambios no se guardan. Abrí establo.html con doble clic desde tu computadora.");
      }
      return false;
    }
  }

  /* ============ utilidades ============ */

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function norm(s) {
    return String(s == null ? "" : s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }
  var puedeGuardar = (function () {
    try {
      localStorage.setItem("__prueba__", "1");
      localStorage.removeItem("__prueba__");
      return true;
    } catch (e) { return false; }
  })();

  function uid() { return "h" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function rndId() { return Math.random(); }
  function hoy() { return new Date().toISOString().slice(0, 10); }

  function toast(msg) {
    var t = $("#toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(t._t);
    t._t = setTimeout(function () { t.classList.remove("on"); }, 3200);
  }

  function estado(id) {
    for (var i = 0; i < ESTADOS.length; i++) if (ESTADOS[i].id === id) return ESTADOS[i];
    return ESTADOS[1];
  }

  function edad(h) {
    if (!h.nacimiento) return null;
    var n = new Date(h.nacimiento);
    if (isNaN(n)) return null;
    var fin = h.fechaBaja ? new Date(h.fechaBaja) : new Date();
    var a = fin.getFullYear() - n.getFullYear();
    var m = fin.getMonth() - n.getMonth();
    if (m < 0 || (m === 0 && fin.getDate() < n.getDate())) a--;
    return a < 0 ? 0 : a;
  }

  function edadTxt(h) {
    var e = edad(h);
    if (e === null) return "edad s/d";
    return e + (e === 1 ? " año" : " años") + (h.fechaBaja ? " (al momento de la baja)" : "");
  }

  function diasDesde(f) {
    if (!f) return null;
    var d = new Date(f);
    if (isNaN(d)) return null;
    return Math.floor((Date.now() - d.getTime()) / 86400000);
  }

  function fmtFecha(f) {
    if (!f) return "—";
    var p = String(f).split("-");
    if (p.length !== 3) return f;
    return p[2] + "/" + p[1] + "/" + p[0];
  }

  function aUSD(monto, moneda) {
    var m = Number(monto) || 0;
    if (moneda === "ARS") return db.settings.fx > 0 ? m / db.settings.fx : 0;
    return m;
  }

  function money(monto, moneda) {
    var usd = aUSD(monto, moneda);
    var val = ui.cur === "ARS" ? usd * (Number(db.settings.fx) || 0) : usd;
    var s = Math.round(val).toLocaleString("es-AR");
    return (ui.cur === "ARS" ? "$ " : "US$ ") + s;
  }

  function gastoTotalUSD(h) {
    return (h.gastos || []).reduce(function (a, g) { return a + aUSD(g.monto, g.moneda); }, 0);
  }
  function ingresoTotalUSD(h) {
    return (h.ingresos || []).reduce(function (a, g) { return a + aUSD(g.monto, g.moneda); }, 0);
  }
  function invertidoUSD(h) {
    return aUSD(h.costoMonto, h.costoMoneda) + gastoTotalUSD(h);
  }

  function promedioApt(h) {
    var vals = [];
    APTITUDES.forEach(function (a) {
      var v = h.aptitudes && h.aptitudes[a.id];
      if (v) vals.push(Number(v));
    });
    if (!vals.length) return null;
    return vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
  }

  function activos() { return db.horses.filter(function (h) { return h.estado !== "baja"; }); }

  function alertas(h) {
    var out = [];
    if (h.estado === "baja") return out;
    var dv = diasDesde(h.vacunaFecha);
    if (h.vacunaFecha == null || h.vacunaFecha === "") out.push({ n: "crit", t: "Sin registro de vacunación" });
    else if (dv > 365) out.push({ n: "crit", t: "Vacunación vencida (hace " + dv + " días)" });
    else if (dv > 320) out.push({ n: "warn", t: "Vacunación por vencer" });

    var dc = diasDesde(h.cogginsFecha);
    if (dc !== null && dc > 180) out.push({ n: "crit", t: "Coggins vencido — no puede viajar" });
    else if (dc !== null && dc > 150) out.push({ n: "warn", t: "Coggins por vencer" });

    var dh = diasDesde(h.herrajeFecha);
    if (dh !== null && dh > 45 && h.estado !== "vientre" && h.estado !== "retirada") out.push({ n: "warn", t: "Herraje atrasado (" + dh + " días)" });

    if (h.estado === "recuperacion") out.push({ n: "crit", t: "En recuperación" + (h.altaEstimada ? " — alta estimada " + fmtFecha(h.altaEstimada) : "") });
    if (h.reproductivo === "prenada" && h.fechaParto) {
      var dp = diasDesde(h.fechaParto);
      if (dp !== null && dp > -45 && dp < 0) out.push({ n: "warn", t: "Parto próximo: " + fmtFecha(h.fechaParto) });
    }
    return out;
  }

  /* ============ búsqueda ============ */

  function buscar(lista, q) {
    var t = norm(q).trim();
    if (!t) return lista;
    var terms = t.split(/\s+/);
    return lista.filter(function (h) {
      var blob = norm([
        h.nombre, h.apodo, h.sexo, h.pelaje, h.ubicacion, h.petisero, h.jinete,
        h.padre, h.madre, h.criador, h.microchip, h.notas, estado(h.estado).label,
        (h.nacimiento || "").slice(0, 4),
        (h.torneos || []).map(function (x) { return x.torneo + " " + x.jugador + " " + x.premio; }).join(" ")
      ].join(" "));
      return terms.every(function (tt) { return blob.indexOf(tt) !== -1; });
    });
  }

  function filtrar(lista) {
    var f = ui.filtros;
    return lista.filter(function (h) {
      if (!f.incluirBajas && h.estado === "baja" && f.estado !== "baja") return false;
      if (f.estado && h.estado !== f.estado) return false;
      if (f.ubicacion && h.ubicacion !== f.ubicacion) return false;
      if (f.sexo && h.sexo !== f.sexo) return false;
      return true;
    });
  }

  function ubicaciones() {
    var s = {};
    db.horses.forEach(function (h) { if (h.ubicacion) s[h.ubicacion] = 1; });
    return Object.keys(s).sort();
  }

  function porNombre(nombre) {
    if (!nombre) return null;
    var n = norm(nombre);
    for (var i = 0; i < db.horses.length; i++) if (norm(db.horses[i].nombre) === n) return db.horses[i];
    return null;
  }

  function hijos(h) {
    var n = norm(h.nombre);
    if (!n) return [];
    return db.horses.filter(function (x) { return x.id !== h.id && (norm(x.madre) === n || norm(x.padre) === n); });
  }

  /* ============ fotos ============ */

  function leerFoto(file, cb) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 620;
        var w = img.width, hh = img.height;
        if (w > hh && w > max) { hh = Math.round(hh * max / w); w = max; }
        else if (hh >= w && hh > max) { w = Math.round(w * max / hh); hh = max; }
        var c = document.createElement("canvas");
        c.width = w; c.height = hh;
        c.getContext("2d").drawImage(img, 0, 0, w, hh);
        cb(c.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = function () { toast("No se pudo leer esa imagen."); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  function bytesUsados() {
    try { return new Blob([JSON.stringify(db)]).size; } catch (e) { return JSON.stringify(db).length; }
  }

  /* ---------- videos (IndexedDB: mucho más espacio que localStorage) ---------- */

  var mediaDB = null;
  function abrirMedia() {
    return new Promise(function (res, rej) {
      if (mediaDB) return res(mediaDB);
      if (!window.indexedDB) return rej(new Error("sin indexedDB"));
      var rq = indexedDB.open("elcorral-media", 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore("videos"); };
      rq.onsuccess = function () { mediaDB = rq.result; res(mediaDB); };
      rq.onerror = function () { rej(rq.error); };
    });
  }
  function guardarVideoIdb(blob) {
    return abrirMedia().then(function (dbm) {
      return new Promise(function (res, rej) {
        var k = "v" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        var tx = dbm.transaction("videos", "readwrite");
        tx.objectStore("videos").put(blob, k);
        tx.oncomplete = function () { res(k); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function leerVideoIdb(k) {
    return abrirMedia().then(function (dbm) {
      return new Promise(function (res, rej) {
        var rq = dbm.transaction("videos").objectStore("videos").get(k);
        rq.onsuccess = function () { res(rq.result || null); };
        rq.onerror = function () { rej(rq.error); };
      });
    });
  }
  function limpiarVideosHuerfanos() {
    abrirMedia().then(function (dbm) {
      var usados = {};
      db.horses.forEach(function (h) { (h.videosIdb || []).forEach(function (v) { usados[v.k] = 1; }); });
      var st = dbm.transaction("videos", "readwrite").objectStore("videos");
      var rq = st.getAllKeys();
      rq.onsuccess = function () {
        (rq.result || []).forEach(function (k) { if (!usados[k]) st.delete(k); });
      };
    }).catch(function () {});
  }
  var urlsVideo = [];
  function hidratarVideos() {
    urlsVideo.forEach(function (u) { URL.revokeObjectURL(u); });
    urlsVideo = [];
    $$("video[data-vkey]").forEach(function (el) {
      leerVideoIdb(el.dataset.vkey).then(function (blob) {
        if (!blob) {
          var pnota = document.createElement("p");
          pnota.className = "note";
          pnota.textContent = "Este video quedó en el dispositivo donde se cargó y acá no está disponible.";
          el.replaceWith(pnota);
          return;
        }
        var u = URL.createObjectURL(blob);
        urlsVideo.push(u);
        el.src = u;
      }).catch(function () {});
    });
  }

  /* ============ componentes ============ */

  function pillEstado(h) {
    var e = estado(h.estado);
    return '<span class="pill" style="background:color-mix(in srgb,' + e.color + ' 15%,transparent);color:' + e.color + '">' +
      '<span class="dotc"></span>' + esc(e.label) + "</span>";
  }

  function letraRepro(h) {
    if (HEMBRAS.indexOf(h.sexo) === -1) return "";
    if (h.reproductivo === "prenada") return "P";
    if (h.reproductivo === "vacia") return "V";
    return "";
  }

  function tamPorEdad(h) {
    var e = edad(h);
    if (e === null) return 20;
    if (e <= 2) return 15;
    if (e <= 4) return 19;
    if (e <= 8) return 25;
    if (e <= 13) return 23;
    return 19;
  }

  function fotoDe(h) { return (h.fotos && h.fotos[0]) || ""; }

  function cardCaballo(h) {
    var f = fotoDe(h);
    var ap = promedioApt(h);
    return '<a class="hcard" href="#/caballo/' + h.id + '">' +
      '<div class="ph">' +
        (f ? '<img src="' + f + '" alt="' + esc(h.nombre) + '">' : '<span class="noimg">' + esc((h.nombre || "?").slice(0, 1).toUpperCase()) + "</span>") +
        '<span class="badge">' + pillEstado(h) + "</span>" +
      "</div>" +
      '<div class="bd">' +
        '<span class="nm">' + esc(h.nombre || "Sin nombre") + (letraRepro(h) ? ' <span class="mono" style="font-size:.7rem;color:var(--st-vientre)">' + letraRepro(h) + "</span>" : "") + "</span>" +
        '<span class="mt">' + esc(h.sexo || "—") + " · " + esc(edadTxt(h)) + (h.ubicacion ? " · " + esc(h.ubicacion) : "") + "</span>" +
        (ap ? '<span class="ap">Físico ' + ap.toFixed(1) + "/10</span>" : "") +
      "</div></a>";
  }

  /* ============ vistas ============ */

  function vTablero() {
    var act = activos();
    if (!db.horses.length) return vBienvenida();

    var porEstado = {};
    ESTADOS.forEach(function (e) { porEstado[e.id] = 0; });
    db.horses.forEach(function (h) { porEstado[h.estado] = (porEstado[h.estado] || 0) + 1; });

    var conAlerta = act.filter(function (h) { return alertas(h).some(function (a) { return a.n === "crit"; }); });
    var prenadas = act.filter(function (h) { return h.reproductivo === "prenada"; });
    var valorUSD = act.reduce(function (a, h) { return a + aUSD(h.valuacion, h.valuacionMoneda); }, 0);
    var invUSD = db.horses.reduce(function (a, h) { return a + invertidoUSD(h); }, 0);
    var aseguradoUSD = act.reduce(function (a, h) { return a + aUSD(h.seguroSuma, h.seguroMoneda); }, 0);
    var cobertura = valorUSD > 0 ? Math.min(100, Math.round(aseguradoUSD / valorUSD * 100)) : 0;

    var proximos = act.map(function (h) { return { h: h, d: diasDesde(h.herrajeFecha) }; })
      .filter(function (x) { return x.d !== null && x.d >= 30; })
      .sort(function (a, b) { return b.d - a.d; }).slice(0, 8);

    var html = '<section class="stack">' +
      '<div class="h-sec"><div><p class="eyebrow">Tablero general</p><h2>' + act.length + ' caballos activos</h2></div>' +
      '<p class="sub">' + db.horses.length + " fichas en total · " + (porEstado.baja || 0) + " dados de baja</p></div>" +
      '<div class="tiles">' +
        tile("Competición", porEstado.competicion || 0, "Juegan torneos esta temporada") +
        tile("En juego", porEstado.juego || 0, "Trabajando y disponibles") +
        tile("Preparación", porEstado.preparacion || 0, "Potros, doma y primer año") +
        tile("Recuperación", porEstado.recuperacion || 0, "En reposo o tratamiento", "alert") +
        tile("Preñadas", prenadas.length, "De " + act.filter(function (h) { return HEMBRAS.indexOf(h.sexo) > -1; }).length + " hembras") +
        tile("Requieren atención", conAlerta.length, "Vencimientos y lesiones", conAlerta.length ? "alert" : "") +
      "</div>";

    html += '<div class="grid2">' +
      '<div class="card pad stack cost"><p class="eyebrow">Valor del conjunto</p>' +
        '<div class="score-big"><span class="n" style="color:var(--brass)">' + money(valorUSD, "USD") + "</span></div>" +
        '<p class="note">Suma de las valuaciones cargadas. Asegurado: ' + money(aseguradoUSD, "USD") + " (" + cobertura + '%)</p>' +
        '<div class="bar-meter ' + (cobertura < 60 ? "crit" : cobertura < 85 ? "warn" : "") + '"><span style="width:' + cobertura + '%"></span></div>' +
        '<p class="note">Invertido acumulado (compra + gastos cargados): <strong>' + money(invUSD, "USD") + "</strong></p></div>" +
      '<div class="card pad stack"><p class="eyebrow">Requieren atención</p>' +
        (conAlerta.length ? '<div class="alerts">' + conAlerta.slice(0, 6).map(function (h) {
            var a = alertas(h).filter(function (x) { return x.n === "crit"; })[0];
            return '<a class="alert-row crit" href="#/caballo/' + h.id + '" style="text-decoration:none;color:inherit"><strong>' + esc(h.nombre) + "</strong><span>" + esc(a.t) + "</span></a>";
          }).join("") + "</div>" +
          (conAlerta.length > 6 ? '<p class="note">y ' + (conAlerta.length - 6) + " más — ver Sanidad</p>" : "")
          : '<p class="sub">Todo al día. Ningún vencimiento crítico.</p>') +
      "</div></div>";

    if (proximos.length) {
      html += '<div class="card"><div class="pad" style="padding-bottom:.4rem"><p class="eyebrow">Herrería — los más atrasados</p></div>' +
        '<div class="scroller"><table><thead><tr><th>Caballo</th><th>Último herraje</th><th class="num">Días</th><th>Ubicación</th></tr></thead><tbody>' +
        proximos.map(function (x) {
          return '<tr class="clickable" data-go="#/caballo/' + x.h.id + '"><td>' + esc(x.h.nombre) + "</td><td>" + fmtFecha(x.h.herrajeFecha) +
            '</td><td class="num">' + x.d + "</td><td>" + esc(x.h.ubicacion || "—") + "</td></tr>";
        }).join("") + "</tbody></table></div></div>";
    }

    html += "</section>";
    return html;
  }

  function tile(k, v, s, cls) {
    return '<div class="tile ' + (cls || "") + '"><span class="k">' + esc(k) + '</span><span class="v">' + v + '</span><span class="s">' + esc(s) + "</span></div>";
  }

  function vBienvenida() {
    return '<section class="card pad"><div class="empty">' +
      "<h3>Todavía no hay caballos cargados</h3>" +
      '<p class="sub" style="max-width:32rem">Podés arrancar cargando el primero a mano, o cargar 100 caballos de muestra para ver cómo funciona todo y después borrarlos.</p>' +
      '<div class="row" style="justify-content:center">' +
        '<a class="btn primary" href="#/nuevo">Cargar mi primer caballo</a>' +
        '<button class="btn" id="seed">Cargar 100 caballos de muestra</button>' +
      "</div></div></section>";
  }

  function vCorral() {
    if (!db.horses.length) return vBienvenida();
    var lista = buscar(db.horses, ui.q).filter(function (h) {
      var f = ui.filtros;
      if (f.ubicacion && h.ubicacion !== f.ubicacion) return false;
      if (f.sexo && h.sexo !== f.sexo) return false;
      return true;
    });
    lista = lista.slice().sort(function (a, b) {
      var ea = edad(a), eb = edad(b);
      return (eb === null ? -1 : eb) - (ea === null ? -1 : ea);
    });

    function dot(h) {
      var e = estado(h.estado);
      var s = tamPorEdad(h);
      var l = letraRepro(h);
      return '<button class="dot' + (h.estado === "competicion" ? " comp" : "") + (h.estado === "baja" ? " baja" : "") + '"' +
        ' style="width:' + s + "px;height:" + s + "px;background:" + e.color + '"' +
        ' data-id="' + h.id + '" data-tip="' + esc(h.nombre) + "|" + esc(e.label) + "|" + esc(edadTxt(h)) + "|" + esc(h.ubicacion || "sin ubicación") + '"' +
        ' aria-label="' + esc(h.nombre + ", " + e.label + ", " + edadTxt(h)) + '">' + (s >= 19 ? l : "") + "</button>";
    }

    var cuerpo;
    if (!lista.length) {
      cuerpo = '<div class="corral"><p class="sub">Ningún caballo coincide con la búsqueda.</p></div>';
    } else if (ui.corralModo === "junto") {
      cuerpo = '<div class="corral">' + lista.map(dot).join("") + "</div>";
    } else {
      var grupos = ui.corralModo === "ubicacion"
        ? ubicaciones().concat([""]).map(function (u) {
            return { label: u || "Sin ubicación", color: "var(--faint)", items: lista.filter(function (h) { return (h.ubicacion || "") === u; }) };
          })
        : ESTADOS.map(function (e) {
            return { label: e.label, color: e.color, items: lista.filter(function (h) { return h.estado === e.id; }), desc: e.desc };
          });
      grupos = grupos.filter(function (g) { return g.items.length; });
      cuerpo = '<div class="potreros">' + grupos.map(function (g) {
        return '<div class="potrero"><div class="pot-head"><span class="sw" style="background:' + g.color + '"></span>' +
          '<span class="pot-t">' + esc(g.label) + '</span><span class="pot-n">' + g.items.length + "</span>" +
          (g.desc ? '<span class="pot-d">' + esc(g.desc) + "</span>" : "") + "</div>" +
          '<div class="pot-body">' + g.items.map(dot).join("") + "</div></div>";
      }).join("") + "</div>";
    }

    var leyenda = ESTADOS.map(function (e) {
      var n = lista.filter(function (h) { return h.estado === e.id; }).length;
      if (!n) return "";
      return '<span class="li"><span class="sw" style="background:' + e.color + '"></span>' + esc(e.label) + " <span class='mono'>" + n + "</span></span>";
    }).join("");

    return '<section class="stack">' +
      '<div class="h-sec"><div><p class="eyebrow">Vista de corral</p><h2>' + lista.length + " caballos en pantalla</h2></div>" +
      '<p class="sub">Cada punto es un caballo. El tamaño es la edad, el color el estado.</p></div>' +
      '<div class="corral-wrap">' +
        '<div class="corral-head">' +
          '<span class="eyebrow">' + (ui.q ? 'Filtrado por "' + esc(ui.q) + '"' : "Todo el conjunto") + "</span>" +
          '<div class="segm" role="group" aria-label="Agrupar el corral">' +
            segBtn("estado", "Por estado") + segBtn("ubicacion", "Por ubicación") + segBtn("junto", "Todo junto") +
          "</div>" +
          '<span class="pill flat">P = preñada</span><span class="pill flat">V = vacía</span>' +
          '<span class="pill" style="background:var(--brass-soft);color:var(--brass)">◎ anillo dorado = competición</span>' +
        "</div>" +
        cuerpo +
        '<div class="legend">' + leyenda +
          '<span class="li" style="margin-left:auto">Tamaño del punto: <span class="sw" style="width:.45rem;height:.45rem;background:var(--faint)"></span> potrillo →' +
          ' <span class="sw" style="width:.95rem;height:.95rem;background:var(--faint)"></span> en plenitud</span>' +
        "</div>" +
      "</div>" +
      '<p class="note">Tocá un punto para abrir la ficha del caballo. Los fallecidos y vendidos aparecen tachados y en gris.</p>' +
    "</section>";
  }

  function vCaballos() {
    if (!db.horses.length) return vBienvenida();
    var base = buscar(db.horses, ui.q);
    var lista = filtrar(base).slice().sort(function (a, b) { return norm(a.nombre).localeCompare(norm(b.nombre)); });
    var f = ui.filtros;

    var html = '<section class="stack">' +
      '<div class="h-sec"><div><p class="eyebrow">Todos los caballos</p><h2>' + lista.length + " de " + db.horses.length + "</h2></div>" +
      '<div class="filters no-print">' +
        selEl("f-estado", "Estado", [""].concat(ESTADOS.map(function (e) { return e.id; })), f.estado, function (v) { return v ? estado(v).label : "Todos los estados"; }) +
        selEl("f-ubic", "Ubicación", [""].concat(ubicaciones()), f.ubicacion, function (v) { return v || "Todas las ubicaciones"; }) +
        selEl("f-sexo", "Sexo", [""].concat(SEXOS), f.sexo, function (v) { return v || "Todos"; }) +
        '<label class="chk"><input type="checkbox" id="f-bajas"' + (f.incluirBajas ? " checked" : "") + "> Incluir fallecidos y vendidos</label>" +
        '<button class="btn sm" id="f-clear">Limpiar</button>' +
      "</div></div>";

    html += lista.length ? '<div class="hlist">' + lista.map(cardCaballo).join("") + "</div>"
      : '<div class="card"><div class="empty"><h3>Sin resultados</h3><p class="sub">Probá con otro nombre, un año de nacimiento o el nombre de la madre.</p></div></div>';

    return html + "</section>";
  }

  function segBtn(modo, label) {
    return '<button type="button" data-modo="' + modo + '" aria-pressed="' + (ui.corralModo === modo) + '">' + esc(label) + "</button>";
  }

  function selEl(id, label, vals, cur, fmt) {
    return '<select id="' + id + '" aria-label="' + esc(label) + '">' + vals.map(function (v) {
      return '<option value="' + esc(v) + '"' + (v === cur ? " selected" : "") + ">" + esc(fmt(v)) + "</option>";
    }).join("") + "</select>";
  }

  function vCrias() {
    if (!db.horses.length) return vBienvenida();
    var madres = db.horses.filter(function (h) { return hijos(h).length > 0; })
      .sort(function (a, b) { return hijos(b).length - hijos(a).length; });
    var prenadas = activos().filter(function (h) { return h.reproductivo === "prenada"; })
      .sort(function (a, b) { return String(a.fechaParto || "9999").localeCompare(String(b.fechaParto || "9999")); });

    var html = '<section class="stack"><div class="h-sec"><div><p class="eyebrow">Reproducción</p><h2>Crías y pedigrí</h2></div>' +
      '<p class="sub">Las relaciones se arman solas: si en un caballo cargás el nombre exacto de la madre o el padre, aparece acá.</p></div>';

    html += '<div class="card"><div class="pad" style="padding-bottom:.5rem"><p class="eyebrow">Preñadas y próximos partos — ' + prenadas.length + "</p></div>";
    html += prenadas.length ? '<div class="scroller"><table><thead><tr><th>Yegua</th><th>Servicio</th><th>Parto estimado</th><th>Receptora</th><th>Ubicación</th></tr></thead><tbody>' +
      prenadas.map(function (h) {
        return '<tr class="clickable" data-go="#/caballo/' + h.id + '"><td>' + esc(h.nombre) + "</td><td>" + esc(h.servicio || "—") + "</td><td>" + fmtFecha(h.fechaParto) +
          "</td><td>" + esc(h.receptora || "—") + "</td><td>" + esc(h.ubicacion || "—") + "</td></tr>";
      }).join("") + "</tbody></table></div>" : '<div class="pad"><p class="sub">Ninguna yegua marcada como preñada.</p></div>';
    html += "</div>";

    html += '<div class="card"><div class="pad" style="padding-bottom:.5rem"><p class="eyebrow">Vientres con producción — ' + madres.length + "</p></div>";
    if (!madres.length) {
      html += '<div class="pad"><p class="sub">Todavía no hay descendencia cargada. Escribí el nombre de la madre en la ficha de cada cría.</p></div>';
    } else {
      html += '<div class="pad stack">' + madres.map(function (m) {
        var hs = hijos(m);
        return '<div style="display:flex;flex-direction:column;gap:.4rem;padding-bottom:.7rem;border-bottom:1px solid var(--rule-soft)">' +
          '<div class="row"><a href="#/caballo/' + m.id + '" style="font-family:var(--serif);font-size:1.1rem;text-decoration:none">' + esc(m.nombre) + "</a>" +
          pillEstado(m) + '<span class="note">' + hs.length + (hs.length === 1 ? " producto" : " productos") + "</span></div>" +
          '<div class="rel">' + hs.map(function (x) {
            return '<a href="#/caballo/' + x.id + '"><span class="sw" style="background:' + estado(x.estado).color + '"></span>' + esc(x.nombre) +
              ' <span class="note tnum">' + (x.nacimiento ? x.nacimiento.slice(0, 4) : "—") + "</span></a>";
          }).join("") + "</div></div>";
      }).join("") + "</div>";
    }
    html += "</div></section>";
    return html;
  }

  function vSanidad() {
    if (!db.horses.length) return vBienvenida();
    var filas = activos().map(function (h) { return { h: h, a: alertas(h) }; })
      .filter(function (x) { return x.a.length; })
      .sort(function (x, y) {
        var cx = x.a.filter(function (a) { return a.n === "crit"; }).length;
        var cy = y.a.filter(function (a) { return a.n === "crit"; }).length;
        return cy - cx;
      });

    return '<section class="stack"><div class="h-sec"><div><p class="eyebrow">Sanidad</p><h2>Vencimientos y estado clínico</h2></div>' +
      '<p class="sub">Vacunación anual, Coggins a 6 meses, herraje a 45 días.</p></div>' +
      '<div class="card">' +
      (filas.length ? '<div class="scroller"><table><thead><tr><th>Caballo</th><th>Estado</th><th>Alertas</th><th>Vacuna</th><th>Coggins</th><th>Herraje</th></tr></thead><tbody>' +
        filas.map(function (x) {
          return '<tr class="clickable" data-go="#/caballo/' + x.h.id + '"><td><strong>' + esc(x.h.nombre) + "</strong></td><td>" + pillEstado(x.h) + "</td>" +
            "<td>" + x.a.map(function (a) { return '<span class="pill ' + (a.n === "crit" ? "crit" : "warn") + '">' + esc(a.t) + "</span>"; }).join(" ") + "</td>" +
            "<td>" + fmtFecha(x.h.vacunaFecha) + "</td><td>" + fmtFecha(x.h.cogginsFecha) + "</td><td>" + fmtFecha(x.h.herrajeFecha) + "</td></tr>";
        }).join("") + "</tbody></table></div>"
        : '<div class="empty"><h3>Todo al día</h3><p class="sub">Ningún caballo con vencimientos ni lesiones activas.</p></div>') +
      "</div></section>";
  }

  function vFinanzas() {
    if (!db.horses.length) return vBienvenida();
    var lista = db.horses.slice().sort(function (a, b) { return invertidoUSD(b) - invertidoUSD(a); });
    var totInv = lista.reduce(function (a, h) { return a + invertidoUSD(h); }, 0);
    var totIng = lista.reduce(function (a, h) { return a + ingresoTotalUSD(h); }, 0);
    var totVal = activos().reduce(function (a, h) { return a + aUSD(h.valuacion, h.valuacionMoneda); }, 0);

    var porRubro = {};
    db.horses.forEach(function (h) {
      (h.gastos || []).forEach(function (g) {
        porRubro[g.rubro || "Otros"] = (porRubro[g.rubro || "Otros"] || 0) + aUSD(g.monto, g.moneda);
      });
    });
    var rubros = Object.keys(porRubro).sort(function (a, b) { return porRubro[b] - porRubro[a]; });
    var maxR = rubros.length ? porRubro[rubros[0]] : 1;

    var html = '<section class="stack cost"><div class="h-sec"><div><p class="eyebrow">Finanzas</p><h2>Costo y valor por caballo</h2></div>' +
      '<div class="row"><span class="note">Cotización USD → ARS</span><input id="fx" type="number" min="1" step="1" value="' + (db.settings.fx || 1000) + '" style="width:6.5rem;padding:.3rem .5rem;background:var(--surface);border:1px solid var(--rule);border-radius:4px" aria-label="Cotización"></div></div>';

    html += '<div class="tiles">' +
      tile("Invertido total", money(totInv, "USD"), "Compra + gastos cargados", "money") +
      tile("Ingresos", money(totIng, "USD"), "Ventas, alquileres y premios", "money") +
      tile("Valor del conjunto", money(totVal, "USD"), "Suma de valuaciones", "money") +
      tile("Patrimonio neto", money(totIng + totVal - totInv, "USD"), "Valor + ingresos − invertido", "money") +
    "</div>";

    if (rubros.length) {
      html += '<div class="card pad stack"><p class="eyebrow">Gasto por rubro</p>' +
        rubros.map(function (r) {
          return '<div class="apt"><div class="r"><span class="lb">' + esc(r) + '</span><span class="bar"><span style="width:' +
            Math.round(porRubro[r] / maxR * 100) + '%;background:var(--brass)"></span></span><span class="n" style="width:auto;min-width:5rem">' + money(porRubro[r], "USD") + "</span></div></div>";
        }).join("") + "</div>";
    }

    html += '<div class="card"><div class="scroller"><table><thead><tr><th>Caballo</th><th>Estado</th><th class="num">Compra</th><th class="num">Gastos</th><th class="num">Invertido</th><th class="num">Valuación</th><th class="num">Ingresos</th><th class="num">Neto</th></tr></thead><tbody>' +
      lista.map(function (h) {
        var inv = invertidoUSD(h), ing = ingresoTotalUSD(h);
        var res = h.estado === "baja" ? ing - inv : ing + aUSD(h.valuacion, h.valuacionMoneda) - inv;
        return '<tr class="clickable" data-go="#/caballo/' + h.id + '"><td><strong>' + esc(h.nombre) + "</strong></td><td>" + pillEstado(h) + "</td>" +
          '<td class="num">' + money(h.costoMonto, h.costoMoneda) + '</td><td class="num">' + money(gastoTotalUSD(h), "USD") + '</td>' +
          '<td class="num">' + money(inv, "USD") + '</td><td class="num">' + money(h.valuacion, h.valuacionMoneda) + '</td>' +
          '<td class="num">' + money(ing, "USD") + '</td><td class="num" style="color:' + (res >= 0 ? "var(--st-juego)" : "var(--st-recup)") + '">' + money(res, "USD") + "</td></tr>";
      }).join("") + "</tbody></table></div></div>" +
      '<p class="note">Los importes se cargan en la moneda de la operación; la conversión usa la cotización de arriba. <strong>Neto</strong> es valuación más ingresos menos lo invertido — en los caballos dados de baja, solo lo que efectivamente entró menos lo invertido.</p>' +
      "</section>";
    return html;
  }

  function vMemoria() {
    var bajas = db.horses.filter(function (h) { return h.estado === "baja"; })
      .sort(function (a, b) { return String(b.fechaBaja || "").localeCompare(String(a.fechaBaja || "")); });

    return '<section class="stack"><div class="h-sec"><div><p class="eyebrow">Archivo</p><h2>Memoria del establo</h2></div>' +
      '<p class="sub">Los caballos que ya no están, con su historia completa. Nada se borra.</p></div>' +
      (bajas.length ? '<div class="hlist">' + bajas.map(cardCaballo).join("") + "</div>"
        : '<div class="card"><div class="empty"><h3>No hay caballos dados de baja</h3><p class="sub">Cuando un caballo se vende o fallece, cambiás su estado a “Fallecida / vendida” y queda archivado acá con toda su ficha.</p></div></div>') +
      "</section>";
  }

  /* ---------- temporadas ---------- */

  function puedeViajar(h) {
    var d = diasDesde(h.cogginsFecha);
    if (h.cogginsFecha == null || h.cogginsFecha === "") return { ok: false, t: "Sin Coggins" };
    if (d > 180) return { ok: false, t: "Coggins vencido" };
    if (d > 150) return { ok: true, aviso: true, t: "Coggins vence pronto" };
    return { ok: true, t: "Papeles al día" };
  }

  function formTemporada(t) {
    t = t || { nombre: "", sede: "", desde: hoy(), hasta: "", notas: "" };
    return '<div class="card pad stack no-print" style="border-color:var(--accent)">' +
      '<p class="eyebrow">' + (t.id ? "Editar temporada" : "Nueva temporada") + "</p>" +
      '<div class="grid2">' +
        '<div class="field"><label>Nombre *</label><input id="tp-nombre" value="' + esc(t.nombre) + '" placeholder="Abierto de Tortugas"></div>' +
        '<div class="field"><label>Sede o lugar</label><input id="tp-sede" value="' + esc(t.sede || "") + '" placeholder="Tortugas Country Club"></div>' +
        '<div class="field"><label>Desde</label><input id="tp-desde" type="date" value="' + esc(t.desde || "") + '"></div>' +
        '<div class="field"><label>Hasta</label><input id="tp-hasta" type="date" value="' + esc(t.hasta || "") + '"></div>' +
      "</div>" +
      '<div class="field"><label>Notas</label><textarea id="tp-notas">' + esc(t.notas || "") + "</textarea></div>" +
      '<div class="row"><button class="btn primary" id="tp-ok">' + (t.id ? "Guardar cambios" : "Crear temporada") + "</button>" +
      '<button class="btn" id="tp-cancel">Cancelar</button></div></div>';
  }

  function vTemporadas() {
    var ts = db.temporadas.slice().sort(function (a, b) { return String(b.desde || "").localeCompare(String(a.desde || "")); });

    var html = '<section class="stack"><div class="h-sec"><div><p class="eyebrow">Temporadas y torneos</p><h2>' +
      (ts.length ? ts.length + (ts.length === 1 ? " temporada armada" : " temporadas armadas") : "Armar una temporada") + "</h2></div>" +
      '<button class="btn primary" id="nueva-temp">+ Nueva temporada</button></div>' +
      '<p class="sub" style="max-width:44rem">Una temporada es la lista de caballos que viajan a un torneo o a una sede. Al armarla, el sistema avisa cuáles no pueden viajar porque tienen el Coggins vencido.</p>';

    if (ui.editandoTemp === "nueva") html += formTemporada(null);

    if (!ts.length && ui.editandoTemp !== "nueva") {
      html += '<div class="card"><div class="empty"><h3>Todavía no armaste ninguna</h3>' +
        '<p class="sub" style="max-width:30rem">Por ejemplo: “Abierto de Tortugas”, “Temporada Palermo” o “Verano en Uruguay”. Le agregás los caballos que viajan y queda la lista lista para el camión.</p>' +
        '<button class="btn primary" id="nueva-temp2">Armar la primera temporada</button></div></div>';
      return html + "</section>";
    }

    html += '<div class="hlist">' + ts.map(function (t) {
      var cab = (t.caballos || []).map(idHorse).filter(Boolean);
      var problemas = cab.filter(function (h) { return !puedeViajar(h).ok; }).length;
      var valor = cab.reduce(function (a, h) { return a + aUSD(h.valuacion, h.valuacionMoneda); }, 0);
      return '<a class="hcard" href="#/temporada/' + t.id + '" style="padding:0">' +
        '<div class="bd" style="padding:.9rem 1rem 1rem;gap:.45rem">' +
          '<span class="eyebrow">' + esc(t.sede || "Sin sede") + "</span>" +
          '<span class="nm">' + esc(t.nombre) + "</span>" +
          '<span class="mt">' + fmtFecha(t.desde) + " → " + fmtFecha(t.hasta) + "</span>" +
          '<div class="row" style="gap:.35rem;margin-top:.2rem"><span class="pill flat">' + cab.length + " caballos</span>" +
          (problemas ? '<span class="pill crit">' + problemas + " sin papeles</span>" : '<span class="pill ok">Papeles al día</span>') + "</div>" +
          '<span class="ap cost">' + money(valor, "USD") + " en pista</span>" +
        "</div></a>";
    }).join("") + "</div>";

    return html + "</section>";
  }

  function idHorse(id) {
    for (var i = 0; i < db.horses.length; i++) if (db.horses[i].id === id) return db.horses[i];
    return null;
  }

  function vTemporada(id) {
