        '<select name="' + name + 'Moneda" aria-label="Moneda" style="width:5.2rem"><option value="USD"' + (curVal !== "ARS" ? " selected" : "") + ">USD</option>" +
        '<option value="ARS"' + (curVal === "ARS" ? " selected" : "") + ">ARS</option></select></div></div>";
    }

    var html = '<section class="stack"><form id="form" class="stack">' +
      '<div class="h-sec"><div><p class="eyebrow">' + (h ? "Editar ficha" : "Nuevo caballo") + "</p><h2>" + esc(h ? h.nombre : "Cargar un caballo") + "</h2></div>" +
      '<div class="row"><a class="btn" href="' + (h ? "#/caballo/" + h.id : "#/caballos") + '">Cancelar</a>' +
      '<button class="btn primary" type="submit">Guardar</button></div></div>';

    html += '<fieldset class="fs"><legend>Identidad</legend><div class="grid2">' +
      inp("nombre", "Nombre *", n.nombre, "text", "required") +
      inp("apodo", "Sobrenombre", n.apodo) +
      sel("sexo", "Sexo", SEXOS, n.sexo || "Yegua") +
      inp("nacimiento", "Fecha de nacimiento", n.nacimiento, "date") +
      inp("pelaje", "Pelaje y señas", n.pelaje) +
      inp("microchip", "Microchip / n° de marca", n.microchip) +
      inp("criador", "Criador", n.criador) +
      sel("origen", "Origen", ["", "Embrión (cría propia)", "Manada (cría propia)", "Compra de embrión", "Comprado"], n.origen) +
      "</div>" +
      '<div class="field"><label>Fotos</label><div class="photos" id="photos"></div>' +
      '<label class="btn sm" style="cursor:pointer;align-self:flex-start;margin-top:.4rem">+ Agregar fotos<input type="file" id="foto-in" accept="image/*" multiple hidden></label>' +
      '<p class="note">Se achican solas a 620 px para no llenar el espacio. Recomendado: hasta 4 por caballo.</p></div>' +
      '<div class="field"><label>Videos</label><div class="rowset" id="vlist"></div>' +
      '<label class="btn sm" style="cursor:pointer;align-self:flex-start;margin-top:.4rem">+ Agregar video<input type="file" id="video-in" accept="video/*" hidden></label>' +
      '<p class="note">Se pueden filmar directo con el celular. Quedan guardados solo en este dispositivo y no entran en el respaldo exportado. Máximo 100 MB por video.</p></div>' +
      inp("video", "Link a video de juego (YouTube u otro)", n.video, "url") +
      "</fieldset>";

    html += '<fieldset class="fs"><legend>Estado y ubicación</legend><div class="grid2">' +
      sel("estado", "Estado", ESTADOS.map(function (e) { return { v: e.id, t: e.label }; }), n.estado || "juego") +
      sel("reproductivo", "Estado reproductivo (hembras)", [{ v: "", t: "No aplica" }, { v: "vacia", t: "Vacía (V)" }, { v: "prenada", t: "Preñada (P)" }], n.reproductivo) +
      inp("ubicacion", "Ubicación", n.ubicacion, "text", 'list="l-ubic"') +
      inp("petisero", "Petisero a cargo", n.petisero) +
      inp("jinete", "Jinete asignado", n.jinete) +
      inp("altaEstimada", "Alta estimada (si está en recuperación)", n.altaEstimada, "date") +
      "</div><datalist id='l-ubic'>" + ubicaciones().map(function (u) { return '<option value="' + esc(u) + '">'; }).join("") + "</datalist>" +
      '<div class="grid2">' + inp("fechaBaja", "Fecha de baja (venta o fallecimiento)", n.fechaBaja, "date") +
      inp("motivoBaja", "Motivo de la baja", n.motivoBaja) + "</div></fieldset>";

    html += '<fieldset class="fs"><legend>Pedigrí y reproducción</legend><div class="grid2">' +
      inp("padre", "Padre", n.padre, "text", 'list="l-cab"') +
      inp("madre", "Madre", n.madre, "text", 'list="l-cab"') +
      inp("servicio", "Servicio / semen", n.servicio) +
      inp("receptora", "Receptora", n.receptora) +
      inp("fechaParto", "Parto estimado", n.fechaParto, "date") +
      "</div><datalist id='l-cab'>" + db.horses.map(function (x) { return '<option value="' + esc(x.nombre) + '">'; }).join("") + "</datalist>" +
      '<p class="note">Escribí el nombre exacto de la madre o el padre y el sistema arma solo el árbol de crías.</p></fieldset>';

    html += '<fieldset class="fs"><legend>Puntaje físico</legend>' +
      APTITUDES.map(function (a) {
        var v = (n.aptitudes && n.aptitudes[a.id]) || 0;
        return '<div class="slider-row"><label for="a-' + a.id + '" style="font-size:.85rem">' + esc(a.label) + "</label>" +
          '<input id="a-' + a.id + '" name="apt_' + a.id + '" type="range" min="0" max="10" step="1" value="' + v + '" data-apt="' + a.id + '">' +
          '<span class="n" id="av-' + a.id + '">' + (v || "–") + "</span></div>";
      }).join("") +
      ta("observacionesFisicas", "Observaciones", n.observacionesFisicas) + "</fieldset>";

    html += '<fieldset class="fs"><legend>Historial deportivo</legend><div class="rowset" id="torneos"></div>' +
      '<button type="button" class="btn sm" id="add-torneo" style="align-self:flex-start">+ Agregar torneo</button></fieldset>';

    html += '<fieldset class="fs"><legend>Sanidad</legend><div class="grid2">' +
      inp("vacunaFecha", "Última vacunación", n.vacunaFecha, "date") +
      inp("cogginsFecha", "Coggins", n.cogginsFecha, "date") +
      inp("herrajeFecha", "Último herraje", n.herrajeFecha, "date") +
      inp("desparasitacionFecha", "Desparasitación", n.desparasitacionFecha, "date") +
      inp("odontologiaFecha", "Odontología", n.odontologiaFecha, "date") +
      "</div>" + ta("historialClinico", "Historial clínico y lesiones", n.historialClinico) + "</fieldset>";

    html += '<fieldset class="fs"><legend>Economía</legend><div class="grid2">' +
      mon("costoMonto", "Costo de adquisición", n.costoMonto, n.costoMoneda) +
      mon("valuacion", "Valuación actual", n.valuacion, n.valuacionMoneda) +
      mon("precioVenta", "Precio pedido", n.precioVenta, n.precioMoneda) +
      mon("seguroSuma", "Suma asegurada", n.seguroSuma, n.seguroMoneda) +
      "</div>" +
      '<p class="eyebrow" style="margin-top:.4rem">Gastos imputados</p><div class="rowset" id="gastos"></div>' +
      '<button type="button" class="btn sm" id="add-gasto" style="align-self:flex-start">+ Agregar gasto</button>' +
      '<p class="eyebrow" style="margin-top:.6rem">Ingresos</p><div class="rowset" id="ingresos"></div>' +
      '<button type="button" class="btn sm" id="add-ingreso" style="align-self:flex-start">+ Agregar ingreso</button>' +
      "</fieldset>";

    html += '<fieldset class="fs"><legend>Notas</legend>' + ta("notas", "Observaciones generales", n.notas) + "</fieldset>";

    html += '<div class="row"><button class="btn primary" type="submit">Guardar caballo</button>' +
      '<a class="btn" href="' + (h ? "#/caballo/" + h.id : "#/caballos") + '">Cancelar</a><span class="grow"></span>' +
      (h ? '<button class="btn danger" type="button" id="del">Eliminar ficha</button>' : "") + "</div>";

    return html + "</form></section>";
  }

  /* filas dinámicas */
  var draft = { fotos: [], fotosMeta: [], videos: [], torneos: [], gastos: [], ingresos: [], _prevFotosMeta: [], _prevVideos: [] };

  function pintarFotos() {
    var box = $("#photos");
    if (!box) return;
    box.innerHTML = draft.fotos.map(function (f, i) {
      return '<div class="p"><img src="' + f + '" alt="Foto ' + (i + 1) + '"><button type="button" data-rm-foto="' + i + '" aria-label="Quitar foto">×</button></div>';
    }).join("") || '<p class="note">Sin fotos todavía.</p>';
  }

  function pintarVideos() {
    var box = $("#vlist");
    if (!box) return;
    box.innerHTML = draft.videos.map(function (v, i) {
      return '<div class="rw" style="grid-template-columns:1fr auto 2rem">' +
        '<div class="field"><label>Título del video</label><input value="' + esc(v.nombre || "") + '" data-vt="' + i + '"></div>' +
        '<span class="note" style="align-self:center">' + (v.blob ? "se sube al guardar · " + v.mb + " MB" : "ya en el servidor") + "</span>" +
        '<button type="button" class="del" data-rm-v="' + i + '" aria-label="Quitar video">×</button></div>';
    }).join("") || '<p class="note">Sin videos todavía.</p>';
  }

  function pintarTorneos() {
    var box = $("#torneos");
    if (!box) return;
    box.innerHTML = draft.torneos.map(function (t, i) {
      return '<div class="rw"><div class="field"><label>Año</label><input value="' + esc(t.anio || "") + '" data-t="anio" data-i="' + i + '" inputmode="numeric"></div>' +
        '<div class="field"><label>Torneo</label><input value="' + esc(t.torneo || "") + '" data-t="torneo" data-i="' + i + '"></div>' +
        '<div class="field"><label>Jugador</label><input value="' + esc(t.jugador || "") + '" data-t="jugador" data-i="' + i + '"></div>' +
        '<div class="field"><label>Chukkers</label><input value="' + esc(t.chukkers || "") + '" data-t="chukkers" data-i="' + i + '" inputmode="numeric"></div>' +
        '<div class="field"><label>Premio</label><input value="' + esc(t.premio || "") + '" data-t="premio" data-i="' + i + '"></div>' +
        '<button type="button" class="del" data-rm-t="' + i + '" aria-label="Quitar">×</button></div>';
    }).join("") || '<p class="note">Sin torneos cargados.</p>';
  }

  function pintarMovs(kind) {
    var box = $("#" + kind);
    if (!box) return;
    var arr = draft[kind];
    var opts = kind === "gastos" ? RUBROS : ["Venta", "Alquiler de temporada", "Premio", "Venta de embrión", "Servicio", "Otros"];
    box.innerHTML = arr.map(function (g, i) {
      return '<div class="rw"><div class="field"><label>Fecha</label><input type="date" value="' + esc(g.fecha || "") + '" data-g="fecha" data-k="' + kind + '" data-i="' + i + '"></div>' +
        '<div class="field"><label>Rubro</label><select data-g="rubro" data-k="' + kind + '" data-i="' + i + '">' +
        opts.map(function (r) { return '<option' + (g.rubro === r ? " selected" : "") + ">" + esc(r) + "</option>"; }).join("") + "</select></div>" +
        '<div class="field"><label>Detalle</label><input value="' + esc(g.detalle || "") + '" data-g="detalle" data-k="' + kind + '" data-i="' + i + '"></div>' +
        '<div class="field"><label>Monto</label><input type="number" step="1" min="0" value="' + esc(g.monto == null ? "" : g.monto) + '" data-g="monto" data-k="' + kind + '" data-i="' + i + '"></div>' +
        '<div class="field"><label>Moneda</label><select data-g="moneda" data-k="' + kind + '" data-i="' + i + '"><option' + (g.moneda !== "ARS" ? " selected" : "") + '>USD</option><option' + (g.moneda === "ARS" ? " selected" : "") + '>ARS</option></select></div>' +
        '<button type="button" class="del" data-rm-g="' + i + '" data-k="' + kind + '" aria-label="Quitar">×</button></div>';
    }).join("") || '<p class="note">Sin movimientos cargados.</p>';
  }

  /* ============ router ============ */

  function ruta() {
    var h = location.hash.replace(/^#\/?/, "") || "tablero";
    var p = h.split("/");
    return { vista: p[0] || "tablero", id: p[1] || null };
  }

  function render() {
    var r = ruta();
    var app = $("#app");

    document.body.classList.toggle("sin-sesion", !sesion.user || r.vista === "f");
    document.body.classList.toggle("rol-limitado", !!(sesion.perfil && sesion.perfil.rol !== "dueno"));

    if (r.vista === "f") { vFichaPublica(r.id); return; }
    if (!sesion.listo) { app.innerHTML = '<section class="card pad"><div class="empty"><h3>Cargando el establo…</h3></div></section>'; return; }
    if (!sesion.user) { app.innerHTML = vLogin(); return; }
    if (!sesion.perfil) { app.innerHTML = vOnboarding(); return; }
    if (r.vista === "finanzas" && sesion.perfil.rol !== "dueno") { location.hash = "#/tablero"; return; }

    var html;

    if (r.vista === "caballo") html = vFicha(r.id);
    else if (r.vista === "nuevo" || r.vista === "editar") html = vForm(r.id);
    else if (r.vista === "corral") html = vCorral();
    else if (r.vista === "caballos") html = vCaballos();
    else if (r.vista === "temporadas") html = vTemporadas();
    else if (r.vista === "temporada") html = vTemporada(r.id);
    else if (r.vista === "armar") html = vPickerCaballos(r.id);
    else if (r.vista === "movimientos") html = vMovimientos();
    else if (r.vista === "crias") html = vCrias();
    else if (r.vista === "sanidad") html = vSanidad();
    else if (r.vista === "finanzas") html = vFinanzas();
    else if (r.vista === "memoria") html = vMemoria();
    else if (r.vista === "datos") html = vDatos();
    else html = vTablero();

    app.innerHTML = html;
    var grupo = { caballo: "caballos", nuevo: "caballos", editar: "caballos", temporada: "temporadas", armar: "temporadas" };
    $$("#tabs a").forEach(function (a) {
      var t = a.getAttribute("href").replace("#/", "");
      a.classList.toggle("on", t === r.vista || t === grupo[r.vista]);
    });
    $$(".cur-toggle button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.cur === ui.cur); });

    if (r.vista === "nuevo" || r.vista === "editar") montarForm(r.id);
    hidratarVideos();
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }

  function montarForm(id) {
    var h = id ? db.horses.filter(function (x) { return x.id === id; })[0] : null;
    draft.fotos = h && h.fotos ? h.fotos.slice() : [];
    draft.fotosMeta = h && h.fotosMeta ? h.fotosMeta.slice() : [];
    while (draft.fotosMeta.length < draft.fotos.length) draft.fotosMeta.push(null);
    draft.videos = h && h.videos ? h.videos.map(function (v) { return { id: v.id, path: v.path, nombre: v.nombre, fecha: v.fecha }; }) : [];
    draft._prevFotosMeta = draft.fotosMeta.filter(Boolean).slice();
    draft._prevVideos = draft.videos.slice();
    draft.torneos = h && h.torneos ? JSON.parse(JSON.stringify(h.torneos)) : [];
    draft.gastos = h && h.gastos ? JSON.parse(JSON.stringify(h.gastos)) : [];
    draft.ingresos = h && h.ingresos ? JSON.parse(JSON.stringify(h.ingresos)) : [];
    pintarFotos(); pintarVideos(); pintarTorneos(); pintarMovs("gastos"); pintarMovs("ingresos");
  }

  function guardar(form, id) {
    var d = new FormData(form);
    var h = id ? db.horses.filter(function (x) { return x.id === id; })[0] : null;
    var nuevo = h || { id: uid(), creado: hoy(), movimientos: [] };
    var ubicAnterior = h ? (h.ubicacion || "") : "";

    ["nombre", "apodo", "sexo", "nacimiento", "pelaje", "microchip", "criador", "origen", "video",
     "estado", "reproductivo", "ubicacion", "petisero", "jinete", "altaEstimada", "fechaBaja", "motivoBaja",
     "padre", "madre", "servicio", "receptora", "fechaParto",
     "vacunaFecha", "cogginsFecha", "herrajeFecha", "desparasitacionFecha", "odontologiaFecha",
     "historialClinico", "observacionesFisicas", "notas"].forEach(function (k) {
      nuevo[k] = (d.get(k) || "").toString().trim();
    });

    ["costoMonto", "valuacion", "precioVenta", "seguroSuma"].forEach(function (k) {
      var v = d.get(k);
      nuevo[k] = v === "" || v == null ? "" : Number(v);
      var mk = k === "costoMonto" ? "costoMoneda" : k === "precioVenta" ? "precioMoneda" : k === "valuacion" ? "valuacionMoneda" : "seguroMoneda";
      nuevo[mk] = d.get(k + "Moneda") || "USD";
    });

    nuevo.aptitudes = {};
    APTITUDES.forEach(function (a) {
      var v = Number(d.get("apt_" + a.id) || 0);
      if (v > 0) nuevo.aptitudes[a.id] = v;
    });

    nuevo.fotos = draft.fotos.slice();
    nuevo.fotosMeta = draft.fotosMeta.slice();
    nuevo.videos = draft.videos.slice();
    nuevo.torneos = draft.torneos.filter(function (t) { return t.torneo || t.anio; });
    nuevo.gastos = draft.gastos.filter(function (g) { return g.monto; });
    nuevo.ingresos = draft.ingresos.filter(function (g) { return g.monto; });

    if (!nuevo.nombre) { toast("Poné al menos el nombre del caballo."); return null; }

    var choca = db.horses.filter(function (x) { return x.id !== nuevo.id && norm(x.nombre) === norm(nuevo.nombre); })[0];
    if (choca) {
      toast("Ya hay otro caballo llamado " + choca.nombre + ". Poné un nombre distinto: el pedigrí se arma por nombre.");
      return null;
    }

    nuevo.movimientos = nuevo.movimientos || [];
    if (h && nuevo.ubicacion && nuevo.ubicacion !== ubicAnterior) {
      var movAuto = { fecha: hoy(), desde: ubicAnterior, hasta: nuevo.ubicacion, motivo: "Cambio cargado desde la ficha", transporte: "" };
      nuevo.movimientos.push(movAuto);
      nuevo._movNuevo = movAuto;
    }

    return { nuevo: nuevo, esNuevo: !h };
  }

  /* ============ eventos ============ */

  document.addEventListener("click", function (ev) {
    var t = ev.target;

    var dot = t.closest && t.closest(".dot");
    if (dot) { location.hash = "#/caballo/" + dot.dataset.id; return; }

    var tr = t.closest && t.closest("tr[data-go]");
    if (tr) { location.hash = tr.dataset.go; return; }

    var gal = t.closest && t.closest("[data-gal]");
    if (gal) { ui.galIdx = Number(gal.dataset.gal); render(); return; }

    var conCopia = t.closest && t.closest("[data-copiar]");
    if (conCopia) {
      var texto = conCopia.dataset.copiar;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(function () { toast("Copiado."); }, function () { toast(texto); });
      } else { toast(texto); }
      return;
    }

    if (t.id === "salir") { sb.auth.signOut().then(function () { location.reload(); }); return; }

    if (t.id === "lg-entrar" || t.id === "lg-crear") {
      var email = ($("#lg-email").value || "").trim();
      var clave = $("#lg-pass").value || "";
      if (!email || !clave) { toast("Completá el correo y la contraseña."); return; }
      t.disabled = true;
      var pAuth = t.id === "lg-entrar"
        ? sb.auth.signInWithPassword({ email: email, password: clave })
        : sb.auth.signUp({ email: email, password: clave, options: { emailRedirectTo: location.origin + location.pathname } });
      pAuth.then(function (r) {
        t.disabled = false;
        if (r.error) { toast(traducirAuth(r.error.message || "")); return; }
        if (t.id === "lg-crear" && !(r.data && r.data.session)) {
          toast("Cuenta creada. Revisá tu correo, tocá el enlace para confirmarla y después entrá.");
          return;
        }
        sesion.user = r.data.session.user;
        cargarPerfil().catch(function (e) { errorDatos(e, "No pude cargar tu perfil"); });
      });
      return;
    }

    if (t.id === "ob-crear" || t.id === "ob-unirse") {
      var miNombre = ($("#ob-nombre").value || "").trim();
      if (!miNombre) { toast("Poné tu nombre."); $("#ob-nombre").focus(); return; }
      var pOb;
      if (t.id === "ob-crear") {
        var nomOrg = ($("#ob-org").value || "").trim();
        if (!nomOrg) { toast("Poné el nombre del criadero."); $("#ob-org").focus(); return; }
        pOb = sb.rpc("crear_organizacion", { p_nombre: nomOrg, p_mi_nombre: miNombre });
      } else {
        var codigo = ($("#ob-codigo").value || "").trim().toLowerCase();
        if (!codigo) { toast("Poné el código de invitación."); $("#ob-codigo").focus(); return; }
        pOb = sb.rpc("unirse_a_organizacion", { p_codigo: codigo, p_mi_nombre: miNombre });
      }
      t.disabled = true;
      pOb.then(function (r) {
        t.disabled = false;
        if (r.error) { toast(r.error.message || "No se pudo."); return; }
        cargarPerfil().catch(function (e) { errorDatos(e, "No pude cargar el criadero"); });
      });
      return;
    }

    if (t.id === "fp-crear") {
      var hfp = idHorse(t.dataset.cab);
      if (!hfp) return;
      var slug = norm(hfp.nombre).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + Math.random().toString(36).slice(2, 6);
      sb.from("fichas_publicas").insert({ organizacion_id: sesion.perfil.organizacion_id, caballo_id: hfp.id, slug: slug }).select("*").single().then(function (r) {
        if (r.error) return errorDatos(r.error, "No se pudo crear la ficha");
        db.fichasPublicas[hfp.id] = r.data;
        toast("Link creado. Copialo y mandalo.");
        render();
      });
      return;
    }
    if (t.id === "fp-toggle") {
      var fpT = db.fichasPublicas[t.dataset.cab];
      if (!fpT) return;
      sb.from("fichas_publicas").update({ activa: !fpT.activa }).eq("id", fpT.id).then(function (r) {
        if (r.error) return errorDatos(r.error, "No se pudo cambiar");
        fpT.activa = !fpT.activa;
        toast(fpT.activa ? "Ficha prendida: el link ya anda." : "Ficha apagada: el link dejó de funcionar.");
        render();
      });
      return;
    }

    if (t.id === "export") { exportar(); return; }    if (t.id === "export") { exportar(); return; }
    if (t.id === "print" || t.id === "print-ficha") { window.print(); return; }
    if (t.id === "f-clear") { ui.filtros = { estado: "", ubicacion: "", sexo: "", incluirBajas: false }; ui.q = ""; $("#q").value = ""; render(); return; }

    if (t.dataset && t.dataset.rmFoto != null) { draft.fotos.splice(Number(t.dataset.rmFoto), 1); draft.fotosMeta.splice(Number(t.dataset.rmFoto), 1); pintarFotos(); return; }
    if (t.dataset && t.dataset.rmV != null) { draft.videos.splice(Number(t.dataset.rmV), 1); pintarVideos(); return; }
    if (t.dataset && t.dataset.rmT != null) { draft.torneos.splice(Number(t.dataset.rmT), 1); pintarTorneos(); return; }
    if (t.dataset && t.dataset.rmG != null) { draft[t.dataset.k].splice(Number(t.dataset.rmG), 1); pintarMovs(t.dataset.k); return; }
    if (t.id === "add-torneo") { draft.torneos.push({ anio: new Date().getFullYear() }); pintarTorneos(); return; }
    if (t.id === "add-gasto") { draft.gastos.push({ fecha: hoy(), rubro: RUBROS[0], moneda: "USD" }); pintarMovs("gastos"); return; }
    if (t.id === "add-ingreso") { draft.ingresos.push({ fecha: hoy(), rubro: "Venta", moneda: "USD" }); pintarMovs("ingresos"); return; }

    if (t.id === "del") {
      var hDel = idHorse(ruta().id);
      if (!hDel) return;
      if (confirm("¿Eliminar la ficha definitivamente? Si el caballo se vendió o falleció, conviene cambiarle el estado a “Fallecida / vendida” en vez de borrarlo.")) {
        repoEliminarCaballo(hDel).then(function () {
          db.horses = db.horses.filter(function (x) { return x.id !== hDel.id; });
          toast("Ficha eliminada.");
          location.hash = "#/caballos";
        }).catch(function (e) { errorDatos(e, "No se pudo eliminar"); });
      }
      return;
    }

    if (t.dataset && t.dataset.cur) { ui.cur = t.dataset.cur; render(); return; }
    if (t.dataset && t.dataset.modo) { ui.corralModo = t.dataset.modo; render(); return; }

    /* --- movimientos --- */
    if (t.id === "mover") { ui.moviendo = ruta().id; render(); return; }
    if (t.id === "mv-cancel") { ui.moviendo = null; render(); return; }
    if (t.id === "mv-ok") {
      var mh = idHorse(t.dataset.id);
      var destino = ($("#mv-hasta").value || "").trim();
      if (!mh) return;
      if (!destino) { toast("Poné a dónde va el caballo."); $("#mv-hasta").focus(); return; }
      mh.movimientos = mh.movimientos || [];
      mh.movimientos.push({
        fecha: $("#mv-fecha").value || hoy(),
        desde: mh.ubicacion || "",
        hasta: destino,
        motivo: ($("#mv-motivo").value || "").trim(),
        transporte: ($("#mv-transporte").value || "").trim()
      });
      var movNuevo = mh.movimientos[mh.movimientos.length - 1];
      mh.ubicacion = destino;
      ui.moviendo = null;
      toast(mh.nombre + " ahora figura en " + destino + ".");
      render();
      repoMover(mh, movNuevo).catch(function (e) { errorDatos(e, "No se pudo registrar el traslado"); });
      return;
    }

    /* --- temporadas --- */
    if (t.id === "nueva-temp" || t.id === "nueva-temp2") { ui.editandoTemp = "nueva"; render(); return; }
    if (t.id === "edit-temp") { ui.editandoTemp = ruta().id; render(); return; }
    if (t.id === "tp-cancel") { ui.editandoTemp = null; render(); return; }
    if (t.id === "tp-ok") {
      var esNueva = ui.editandoTemp === "nueva";
      var te = esNueva ? { id: "t" + Date.now().toString(36) + Math.floor(rndId() * 1000), caballos: [] }
                       : db.temporadas.filter(function (x) { return x.id === ui.editandoTemp; })[0];
      if (!te) return;
      var nom = ($("#tp-nombre").value || "").trim();
      if (!nom) { toast("Poné un nombre para la temporada."); $("#tp-nombre").focus(); return; }
      te.nombre = nom;
      te.sede = ($("#tp-sede").value || "").trim();
      te.desde = $("#tp-desde").value || "";
      te.hasta = $("#tp-hasta").value || "";
      te.notas = ($("#tp-notas").value || "").trim();
      var filaTemp = { organizacion_id: sesion.perfil.organizacion_id, nombre: te.nombre, sede: te.sede || null, desde: te.desde || null, hasta: te.hasta || null, notas: te.notas || null };
      if (esNueva) {
        sb.from("temporadas").insert(filaTemp).select("id").single().then(function (r) {
          if (r.error) return errorDatos(r.error, "No se pudo crear la temporada");
          te.id = r.data.id;
          db.temporadas.push(te);
          ui.editandoTemp = null;
          toast("Temporada creada. Ahora agregale los caballos.");
          location.hash = "#/temporada/" + te.id;
        });
      } else {
        sb.from("temporadas").update(filaTemp).eq("id", te.id).then(function (r) {
          if (r.error) return errorDatos(r.error, "No se pudo guardar la temporada");
          ui.editandoTemp = null;
          toast("Temporada actualizada.");
          render();
        });
      }
      return;
    }
    if (t.id === "del-temp") {
      var td = ruta().id;
      if (confirm("¿Eliminar esta temporada? Los caballos no se tocan, solo se borra la lista.")) {
        sb.from("temporadas").delete().eq("id", td).then(function (r) {
          if (r.error) return errorDatos(r.error, "No se pudo eliminar la temporada");
          db.temporadas = db.temporadas.filter(function (x) { return x.id !== td; });
          toast("Temporada eliminada.");
          location.hash = "#/temporadas";
        });
      }
      return;
    }
    if (t.id === "add-cab") { ui.q = ""; $("#q").value = ""; location.hash = "#/armar/" + ruta().id; return; }
    if (t.dataset && t.dataset.quitar) {
      var tq = db.temporadas.filter(function (x) { return x.id === t.dataset.temp; })[0];
      if (!tq) return;
      tq.caballos = (tq.caballos || []).filter(function (i) { return i !== t.dataset.quitar; });
      render();
      sb.from("temporada_caballos").delete().eq("temporada_id", tq.id).eq("caballo_id", t.dataset.quitar).then(function (r) {
        if (r.error) errorDatos(r.error, "No se pudo sacar de la lista");
      });
      return;
    }
  });

  document.addEventListener("input", function (ev) {
    var t = ev.target;
    if (t.id === "q") {
      ui.q = t.value;
      var r = ruta();
      if (["caballos", "corral", "armar", "movimientos", "memoria"].indexOf(r.vista) === -1) location.hash = "#/caballos";
      else render();
      return;
    }
    if (t.id === "fx") {
      db.settings.fx = Number(t.value) || 1;
      try { localStorage.setItem("elcorral.fx", String(db.settings.fx)); } catch (e) {}
      render(); $("#fx") && $("#fx").focus();
      return;
    }
    if (t.dataset && t.dataset.apt) { var s = $("#av-" + t.dataset.apt); if (s) s.textContent = t.value === "0" ? "–" : t.value; return; }
    if (t.dataset && t.dataset.vt != null) { draft.videos[Number(t.dataset.vt)].nombre = t.value; return; }
    if (t.dataset && t.dataset.t) { draft.torneos[Number(t.dataset.i)][t.dataset.t] = t.value; return; }
    if (t.dataset && t.dataset.g) { draft[t.dataset.k][Number(t.dataset.i)][t.dataset.g] = t.value; return; }
  });

  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.id === "f-estado") { ui.filtros.estado = t.value; render(); return; }
    if (t.id === "f-ubic") { ui.filtros.ubicacion = t.value; render(); return; }
    if (t.id === "f-sexo") { ui.filtros.sexo = t.value; render(); return; }
    if (t.id === "f-bajas") { ui.filtros.incluirBajas = t.checked; render(); return; }

    if (t.dataset && t.dataset.pick) {
      var tp = db.temporadas.filter(function (x) { return x.id === t.dataset.temp; })[0];
      if (!tp) return;
      tp.caballos = tp.caballos || [];
      if (t.checked) {
        if (tp.caballos.indexOf(t.dataset.pick) === -1) tp.caballos.push(t.dataset.pick);
        sb.from("temporada_caballos").insert({ temporada_id: tp.id, caballo_id: t.dataset.pick }).then(function (r) {
          if (r.error) errorDatos(r.error, "No se pudo agregar a la lista");
        });
      } else {
        tp.caballos = tp.caballos.filter(function (i) { return i !== t.dataset.pick; });
        sb.from("temporada_caballos").delete().eq("temporada_id", tp.id).eq("caballo_id", t.dataset.pick).then(function (r) {
          if (r.error) errorDatos(r.error, "No se pudo sacar de la lista");
        });
      }
      return;
    }
    if (t.dataset && t.dataset.rolDe) {
      var uidRol = t.dataset.rolDe, rolNuevo = t.value;
      sb.from("perfiles").update({ rol: rolNuevo }).eq("user_id", uidRol).then(function (r) {
        if (r.error) return errorDatos(r.error, "No se pudo cambiar el rol");
        (db.equipo || []).forEach(function (pf) { if (pf.user_id === uidRol) pf.rol = rolNuevo; });
        toast("Rol actualizado.");
      });
      return;
    }
    if (t.dataset && t.dataset.g) { draft[t.dataset.k][Number(t.dataset.i)][t.dataset.g] = t.value; return; }

    if (t.id === "video-in") {
      var vf = t.files && t.files[0];
      t.value = "";
      if (!vf) return;
      if (vf.size > 100 * 1024 * 1024) { toast("Ese video pesa más de 100 MB. Filmá uno más corto o recortalo."); return; }
      var vmb = Math.max(1, Math.round(vf.size / 1048576));
      draft.videos.push({ blob: vf, nombre: vf.name.replace(/\.[^.]+$/, ""), mb: vmb });
      pintarVideos();
      return;
    }

    if (t.id === "foto-in") {
      var files = Array.prototype.slice.call(t.files || []);
      files.forEach(function (f) {
        leerFoto(f, function (dataUrl) { draft.fotos.push(dataUrl); draft.fotosMeta.push(null); pintarFotos(); });
      });
      t.value = "";
      return;
    }

  });

  document.addEventListener("submit", function (ev) {  });

  document.addEventListener("submit", function (ev) {
    if (ev.target.id !== "form") return;
    ev.preventDefault();
    var r = ruta();
    var res = guardar(ev.target, r.vista === "editar" ? r.id : null);
    if (!res) return;
    var n = res.nuevo;
    var conVideos = n.videos.some(function (v) { return v.blob; });
    toast(conVideos ? "Guardando… los videos pueden tardar un rato." : "Guardando…");
    repoGuardarCaballo(n, res.esNuevo).then(function () {
      if (res.esNuevo) db.horses.push(n);
      return repoRefrescarMedios(n);
    }).then(function () {
      toast("Guardado.");
      location.hash = "#/caballo/" + n.id;
      render();
    }).catch(function (e) { errorDatos(e, "No se pudo guardar"); });
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "/" && document.activeElement !== $("#q") && !/input|textarea|select/i.test(document.activeElement.tagName)) {
      ev.preventDefault(); $("#q").focus(); $("#q").select();
    }
    if (ev.key === "Escape" && document.activeElement === $("#q")) { $("#q").blur(); }
    if (ev.key === "Enter" && document.activeElement && (document.activeElement.id === "lg-pass" || document.activeElement.id === "lg-email")) {
      var bLogin = $("#lg-entrar");
      if (bLogin) bLogin.click();
    }
  });

  /* tooltip del corral */
  var tip = null;
  document.addEventListener("mouseover", function (ev) {
    var d = ev.target.closest && ev.target.closest(".dot");
    if (!d) return;
    tip = $("#tip");
    var p = (d.dataset.tip || "").split("|");
    tip.innerHTML = "<b>" + esc(p[0]) + '</b><br><span class="m">' + esc(p[1]) + "</span><br>" + esc(p[2]) + " · " + esc(p[3]);
    tip.classList.add("on");
    mover(ev);
  });
  document.addEventListener("mousemove", function (ev) { if (tip && tip.classList.contains("on")) mover(ev); });
  document.addEventListener("mouseout", function (ev) {
    if (ev.target.closest && ev.target.closest(".dot") && tip) tip.classList.remove("on");
  });
  function mover(ev) {
    var t = $("#tip");
    var x = Math.min(ev.clientX + 14, window.innerWidth - t.offsetWidth - 10);
    var y = ev.clientY + 16;
    if (y + t.offsetHeight > window.innerHeight) y = ev.clientY - t.offsetHeight - 12;
    t.style.left = x + "px"; t.style.top = y + "px";
  }

  window.addEventListener("hashchange", function () { ui.galIdx = 0; ui.moviendo = null; ui.editandoTemp = null; render(); });

  /* ============ export ============ */

  function exportar() {
    var blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "el-corral-respaldo-" + hoy() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    toast("Respaldo descargado. Guardalo en un lugar seguro.");
  }

  /* ============ datos de ejemplo ============ */

  /* ============ arranque ============ */  /* ============ arranque ============ */

  if (!location.hash) location.hash = "#/tablero";
  render();
  iniciar();
  window.addEventListener("focus", function () {
    if (sesion.user && sesion.perfil && Date.now() - ultimaCarga > 60000) {
      cargarTodo().then(render).catch(function () {});
    }
  });
})();
</script>
