    var html = '<section class="stack">' +
      '<div class="row no-print"><a class="btn sm" href="#/temporadas">← Temporadas</a><span class="grow"></span>' +
      '<button class="btn sm" id="print">Imprimir lista</button>' +
      '<button class="btn sm" id="edit-temp">Editar datos</button>' +
      '<button class="btn sm danger" id="del-temp">Eliminar</button></div>' +
      '<div class="h-sec"><div><p class="eyebrow">' + esc(t.sede || "Temporada") + " · " + fmtFecha(t.desde) + " → " + fmtFecha(t.hasta) + "</p>" +
      '<h2 style="font-size:clamp(1.8rem,4vw,2.5rem)">' + esc(t.nombre) + "</h2></div></div>";

    if (ui.editandoTemp === t.id) html += formTemporada(t);

    html += '<div class="tiles">' +
      tile("Caballos en la lista", cab.length, "Van a viajar") +
      tile("Sin papeles para viajar", problemas.length, "Coggins vencido o sin cargar", problemas.length ? "alert" : "") +
      tile("Valor en pista", money(valor, "USD"), "Suma de valuaciones", "money") +
      tile("Edad promedio", cab.length ? (cab.reduce(function (a, h) { return a + (edad(h) || 0); }, 0) / cab.length).toFixed(1) : "—", "Años") +
    "</div>";

    if (problemas.length) {
      html += '<div class="card pad stack"><p class="eyebrow" style="color:var(--st-recup)">No pueden subir al camión</p><div class="alerts">' +
        problemas.map(function (h) {
          return '<a class="alert-row crit" href="#/caballo/' + h.id + '" style="text-decoration:none;color:inherit"><strong>' + esc(h.nombre) + "</strong><span>" + esc(puedeViajar(h).t) + "</span></a>";
        }).join("") + "</div></div>";
    }

    html += '<div class="card"><div class="pad" style="padding-bottom:.5rem"><div class="row"><p class="eyebrow grow">Lista de viaje</p>' +
      '<button class="btn sm no-print" id="add-cab">+ Agregar caballos</button></div></div>';

    html += cab.length ? '<div class="scroller"><table><thead><tr><th>Caballo</th><th>Estado</th><th>Edad</th><th>Petisero</th><th>Ubicación hoy</th><th>Papeles</th><th class="no-print"></th></tr></thead><tbody>' +
      cab.map(function (h) {
        var p = puedeViajar(h);
        return '<tr><td><a href="#/caballo/' + h.id + '" style="text-decoration:none"><strong>' + esc(h.nombre) + "</strong></a></td><td>" + pillEstado(h) + "</td>" +
          "<td class='tnum'>" + (edad(h) === null ? "—" : edad(h)) + "</td><td>" + esc(h.petisero || "—") + "</td><td>" + esc(h.ubicacion || "—") + "</td>" +
          '<td><span class="pill ' + (p.ok ? (p.aviso ? "warn" : "ok") : "crit") + '">' + esc(p.t) + "</span></td>" +
          '<td class="no-print"><button class="btn sm" data-quitar="' + h.id + '" data-temp="' + t.id + '">Sacar</button></td></tr>';
      }).join("") + "</tbody></table></div>"
      : '<div class="empty"><h3>La lista está vacía</h3><p class="sub">Agregá los caballos que viajan a esta temporada.</p></div>';

    html += "</div>";
    if (t.notas) html += '<div class="card pad stack"><p class="eyebrow">Notas</p><p style="white-space:pre-wrap">' + esc(t.notas) + "</p></div>";
    return html + "</section>";
  }

  function vPickerCaballos(tempId) {
    var t = db.temporadas.filter(function (x) { return x.id === tempId; })[0];
    if (!t) return "";
    var ya = t.caballos || [];
    var lista = buscar(activos(), ui.q).sort(function (a, b) { return norm(a.nombre).localeCompare(norm(b.nombre)); });
    return '<section class="stack"><div class="row no-print"><a class="btn sm" href="#/temporada/' + t.id + '">← ' + esc(t.nombre) + "</a></div>" +
      '<div class="h-sec"><div><p class="eyebrow">Armar la lista</p><h2>Elegí los caballos que viajan</h2></div>' +
      '<p class="sub">Usá el buscador de arriba para filtrar. Se guardan solos al tildarlos.</p></div>' +
      '<div class="card"><div class="scroller"><table><thead><tr><th style="width:3rem"></th><th>Caballo</th><th>Estado</th><th>Edad</th><th>Ubicación</th><th>Papeles</th></tr></thead><tbody>' +
      lista.map(function (h) {
        var p = puedeViajar(h);
        return "<tr><td><input type='checkbox' data-pick='" + h.id + "' data-temp='" + t.id + "'" + (ya.indexOf(h.id) > -1 ? " checked" : "") + "></td>" +
          "<td><strong>" + esc(h.nombre) + "</strong></td><td>" + pillEstado(h) + "</td><td class='tnum'>" + (edad(h) === null ? "—" : edad(h)) +
          "</td><td>" + esc(h.ubicacion || "—") + '</td><td><span class="pill ' + (p.ok ? (p.aviso ? "warn" : "ok") : "crit") + '">' + esc(p.t) + "</span></td></tr>";
      }).join("") + "</tbody></table></div></div></section>";
  }

  /* ---------- movimientos ---------- */

  function todosMovimientos() {
    var out = [];
    db.horses.forEach(function (h) {
      (h.movimientos || []).forEach(function (m) { out.push({ h: h, m: m }); });
    });
    return out.sort(function (a, b) { return String(b.m.fecha || "").localeCompare(String(a.m.fecha || "")); });
  }

  function vMovimientos() {
    if (!db.horses.length) return vBienvenida();
    var todos = todosMovimientos();
    var f = buscar(db.horses, ui.q);
    var ids = {};
    f.forEach(function (h) { ids[h.id] = 1; });
    var movs = ui.q ? todos.filter(function (x) { return ids[x.h.id]; }) : todos;

    return '<section class="stack"><div class="h-sec"><div><p class="eyebrow">Logística</p><h2>Registro de movimientos</h2></div>' +
      '<p class="sub">Cada traslado queda asentado. La ubicación anterior no se pisa.</p></div>' +
      '<div class="card">' +
      (movs.length ? '<div class="scroller"><table><thead><tr><th>Fecha</th><th>Caballo</th><th>Desde</th><th>Hasta</th><th>Motivo</th><th>Transporte</th></tr></thead><tbody>' +
        movs.slice(0, 300).map(function (x) {
          return '<tr class="clickable" data-go="#/caballo/' + x.h.id + '"><td class="tnum">' + fmtFecha(x.m.fecha) + "</td>" +
            "<td><strong>" + esc(x.h.nombre) + "</strong></td><td>" + esc(x.m.desde || "—") +
            '</td><td><span style="color:var(--accent);font-weight:600">' + esc(x.m.hasta || "—") + "</span></td><td>" + esc(x.m.motivo || "—") +
            "</td><td>" + esc(x.m.transporte || "—") + "</td></tr>";
        }).join("") + "</tbody></table></div>" +
        (movs.length > 300 ? '<div class="pad"><p class="note">Mostrando los 300 más recientes de ' + movs.length + ".</p></div>" : "")
        : '<div class="empty"><h3>Sin movimientos registrados</h3><p class="sub">Desde la ficha de cualquier caballo, con el botón “Mover”, queda asentado el traslado.</p></div>') +
      "</div></section>";
  }

  function vDatos() {
    var b = bytesUsados();
    var pct = Math.min(100, Math.round(b / (4.6 * 1024 * 1024) * 100));
    var fotos = db.horses.reduce(function (a, h) { return a + ((h.fotos || []).length); }, 0);

    return '<section class="stack"><div class="h-sec"><div><p class="eyebrow">Datos</p><h2>Respaldo y espacio</h2></div></div>' +
      '<div class="grid2">' +
        '<div class="card pad stack"><p class="eyebrow">Respaldo</p>' +
          '<p class="sub">Los datos viven en este navegador. Exportá seguido: ese archivo es tu copia de seguridad y sirve para pasar todo a otra computadora o al celular. Ojo: los videos no entran en el respaldo, quedan solo en el dispositivo donde se cargaron.</p>' +
          '<div class="row"><button class="btn primary" id="export">Exportar respaldo</button>' +
          '<label class="btn" style="cursor:pointer">Importar respaldo<input type="file" id="import" accept="application/json" hidden></label>' +
          '<button class="btn" id="print">Imprimir listado</button></div></div>' +
        '<div class="card pad stack"><p class="eyebrow">Espacio usado</p>' +
          '<div class="score-big"><span class="n">' + (b / 1048576).toFixed(2) + '</span><span class="d">MB de ~4,6 MB disponibles</span></div>' +
          '<div class="bar-meter ' + (pct > 85 ? "crit" : pct > 65 ? "warn" : "") + '"><span style="width:' + pct + '%"></span></div>' +
          '<p class="note">' + db.horses.length + " fichas · " + fotos + " fotos. Las fotos se achican automáticamente al cargarlas. Si te acercás al límite, dejá una sola foto por caballo y guardá el resto aparte.</p></div>" +
      "</div>" +
      '<div class="card pad stack"><p class="eyebrow">Zona de riesgo</p>' +
        '<div class="row"><button class="btn" id="seed2">Cargar 100 caballos de muestra</button>' +
        '<button class="btn danger" id="wipe">Borrar todo</button></div>' +
        '<p class="note">“Borrar todo” elimina las fichas de este navegador y no se puede deshacer. Exportá antes.</p></div>' +
      "</section>";
  }

  /* ---------- ficha ---------- */

  function vFicha(id) {
    var h = db.horses.filter(function (x) { return x.id === id; })[0];
    if (!h) return '<section class="card"><div class="empty"><h3>Ese caballo ya no está</h3><a class="btn" href="#/caballos">Volver al listado</a></div></section>';

    var fotos = h.fotos || [];
    if (ui.galIdx >= fotos.length) ui.galIdx = 0;
    var ap = promedioApt(h);
    var al = alertas(h);
    var hs = hijos(h);
    var madre = porNombre(h.madre), padre = porNombre(h.padre);
    var e = estado(h.estado);

    var html = '<section class="stack">' +
      '<div class="row no-print"><a class="btn sm" href="#/caballos">← Caballos</a><span class="grow"></span>' +
        '<button class="btn sm" id="mover">Mover</button>' +
        '<button class="btn sm" id="print-ficha">Imprimir ficha de venta</button>' +
        '<a class="btn sm" href="#/editar/' + h.id + '">Editar</a></div>';

    if (ui.moviendo === h.id) {
      html += '<div class="card pad stack no-print" style="border-color:var(--accent)"><p class="eyebrow">Registrar traslado</p>' +
        '<div class="grid2">' +
          '<div class="field"><label>Sale de</label><input id="mv-desde" value="' + esc(h.ubicacion || "") + '" readonly></div>' +
          '<div class="field"><label>Llega a</label><input id="mv-hasta" list="l-ubic" placeholder="Campo, cancha, clínica…"></div>' +
          '<div class="field"><label>Fecha</label><input id="mv-fecha" type="date" value="' + hoy() + '"></div>' +
          '<div class="field"><label>Motivo</label><input id="mv-motivo" placeholder="Torneo, tratamiento, descanso…"></div>' +
          '<div class="field"><label>Transporte</label><input id="mv-transporte" placeholder="Camión propio, flete…"></div>' +
        "</div><datalist id='l-ubic'>" + ubicaciones().map(function (u) { return '<option value="' + esc(u) + '">'; }).join("") + "</datalist>" +
        '<div class="row"><button class="btn primary" id="mv-ok" data-id="' + h.id + '">Registrar y actualizar ubicación</button>' +
        '<button class="btn" id="mv-cancel">Cancelar</button></div>' +
        '<p class="note">Queda asentado el traslado en el historial y el caballo pasa a figurar en el destino.</p></div>';
    }

    html += '<div class="ficha-top">' +
      '<div class="gal">' +
        '<div class="main">' + (fotos.length ? '<img src="' + fotos[ui.galIdx] + '" alt="' + esc(h.nombre) + '">'
          : '<span style="font-family:var(--serif);font-size:4rem;color:var(--faint)">' + esc((h.nombre || "?").slice(0, 1).toUpperCase()) + "</span>") + "</div>" +
        (fotos.length > 1 ? '<div class="thumbs">' + fotos.map(function (f, i) {
          return '<button data-gal="' + i + '" aria-current="' + (i === ui.galIdx) + '"><img src="' + f + '" alt="Foto ' + (i + 1) + '"></button>';
        }).join("") + "</div>" : "") +
        (h.video ? '<a class="btn sm" href="' + esc(h.video) + '" target="_blank" rel="noopener">▶ Ver video de juego</a>' : "") +
        (h.precioVenta ? '<div class="price-box cost"><span class="k">Precio pedido</span><span class="v">' + money(h.precioVenta, h.precioMoneda) + "</span></div>" : "") +
      "</div>";

    html += '<div class="stack">' +
      '<div><div class="row" style="gap:.6rem">' + pillEstado(h) +
        (h.estado === "competicion" ? '<span class="pill" style="background:var(--brass-soft);color:var(--brass)">Temporada activa</span>' : "") +
        (letraRepro(h) === "P" ? '<span class="pill" style="background:color-mix(in srgb,var(--st-vientre) 15%,transparent);color:var(--st-vientre)">Preñada</span>' : "") +
        (letraRepro(h) === "V" ? '<span class="pill flat">Vacía</span>' : "") +
      "</div>" +
      '<h1 class="ficha-name">' + esc(h.nombre || "Sin nombre") + "</h1>" +
      '<p class="ficha-sub">' + esc([h.apodo ? "“" + h.apodo + "”" : "", h.sexo, edadTxt(h), h.pelaje].filter(Boolean).join(" · ")) + "</p></div>";

    html += '<div class="kv">' +
      kv("Nacimiento", fmtFecha(h.nacimiento)) +
      kv("Ubicación", h.ubicacion || "—") +
      kv("Petisero", h.petisero || "—") +
      kv("Jinete", h.jinete || "—") +
      kv("Criador", h.criador || "—") +
      kv("Microchip / marca", h.microchip || "—") +
    "</div>";

    if (al.length) {
      html += '<div class="alerts no-print">' + al.map(function (a) {
        return '<div class="alert-row ' + (a.n === "crit" ? "crit" : "warn") + '">' + esc(a.t) + "</div>";
      }).join("") + "</div>";
    }

    html += "</div></div>";

    /* aptitudes */
    if (ap) {
      html += '<div class="card pad stack"><div class="row"><p class="eyebrow grow">Puntaje físico y aptitudes</p>' +
        '<div class="score-big"><span class="n">' + ap.toFixed(1) + '</span><span class="d">promedio general</span></div></div>' +
        '<div class="apt">' + APTITUDES.map(function (a) {
          var v = (h.aptitudes && h.aptitudes[a.id]) || 0;
          if (!v) return "";
          return '<div class="r"><span class="lb">' + esc(a.label) + '</span><span class="bar"><span style="width:' + (v * 10) + '%"></span></span><span class="n">' + v + "</span></div>";
        }).join("") + "</div>" +
        (h.observacionesFisicas ? '<p class="sub">' + esc(h.observacionesFisicas) + "</p>" : "") + "</div>";
    }

    /* videos */
    var vids = h.videosIdb || [];
    if (vids.length) {
      html += '<div class="card pad stack no-print"><p class="eyebrow">Videos — ' + vids.length + "</p>" +
        '<div class="vgrid">' + vids.map(function (v) {
          return '<figure class="vfig"><video controls preload="metadata" playsinline data-vkey="' + esc(v.k) + '"></video>' +
            (v.nombre ? '<figcaption class="note">' + esc(v.nombre) + "</figcaption>" : "") + "</figure>";
        }).join("") + "</div></div>";
    }

    /* torneos */
    var tor = h.torneos || [];
    if (tor.length) {
      var chukkers = tor.reduce(function (a, t) { return a + (Number(t.chukkers) || 0); }, 0);
      var premios = tor.filter(function (t) { return t.premio; });
      html += '<div class="card"><div class="pad" style="padding-bottom:.5rem"><div class="row"><p class="eyebrow grow">Historial deportivo</p>' +
        '<span class="pill flat">' + tor.length + " torneos</span><span class='pill flat'>" + chukkers + " chukkers</span>" +
        (premios.length ? "<span class='pill' style='background:var(--brass-soft);color:var(--brass)'>" + premios.length + " premios</span>" : "") + "</div></div>" +
        '<div class="scroller"><table><thead><tr><th>Año</th><th>Torneo</th><th>Jugador</th><th class="num">Chukkers</th><th>Resultado</th></tr></thead><tbody>' +
        tor.slice().sort(function (a, b) { return String(b.anio || "").localeCompare(String(a.anio || "")); }).map(function (t) {
          return "<tr><td class='tnum'>" + esc(t.anio || "—") + "</td><td>" + esc(t.torneo || "—") + "</td><td>" + esc(t.jugador || "—") +
            '</td><td class="num">' + esc(t.chukkers || "—") + '</td><td>' + (t.premio ? '<span class="prize">★ ' + esc(t.premio) + "</span>" : "—") + "</td></tr>";
        }).join("") + "</tbody></table></div></div>";
    }

    /* pedigrí y descendencia */
    html += '<div class="grid2">' +
      '<div class="card pad stack"><p class="eyebrow">Pedigrí</p>' +
        '<div class="kv">' + kv("Padre", padre ? '<a href="#/caballo/' + padre.id + '">' + esc(padre.nombre) + "</a>" : esc(h.padre || "—"), true) +
        kv("Madre", madre ? '<a href="#/caballo/' + madre.id + '">' + esc(madre.nombre) + "</a>" : esc(h.madre || "—"), true) +
        kv("Origen", h.origen || "—") + "</div></div>" +
      '<div class="card pad stack"><p class="eyebrow">Descendencia — ' + hs.length + "</p>" +
        (hs.length ? '<div class="rel">' + hs.map(function (x) {
          return '<a href="#/caballo/' + x.id + '"><span class="sw" style="background:' + estado(x.estado).color + '"></span>' + esc(x.nombre) +
            ' <span class="note tnum">' + (x.nacimiento ? x.nacimiento.slice(0, 4) : "") + "</span></a>";
        }).join("") + "</div>" : '<p class="sub">Sin productos cargados.</p>') +
        (h.reproductivo === "prenada" ? '<p class="note">Preñada — parto estimado ' + fmtFecha(h.fechaParto) + (h.receptora ? " · receptora: " + esc(h.receptora) : "") + "</p>" : "") +
      "</div></div>";

    /* movimientos */
    var mvs = (h.movimientos || []).slice().sort(function (a, b) { return String(b.fecha || "").localeCompare(String(a.fecha || "")); });
    html += '<div class="card pad stack"><div class="row"><p class="eyebrow grow">Historial de movimientos</p>' +
      '<span class="pill flat">Hoy en ' + esc(h.ubicacion || "sin ubicación") + "</span></div>";
    if (mvs.length) {
      html += '<ol class="timeline">' + mvs.map(function (m, i) {
        return '<li class="tl' + (i === 0 ? " now" : "") + '"><span class="tl-f tnum">' + fmtFecha(m.fecha) + "</span>" +
          '<span class="tl-r">' + esc(m.desde || "—") + ' <span class="tl-a">→</span> <strong>' + esc(m.hasta || "—") + "</strong></span>" +
          '<span class="tl-m">' + esc([m.motivo, m.transporte].filter(Boolean).join(" · ") || "—") + "</span></li>";
      }).join("") + "</ol>";
    } else {
      html += '<p class="sub">Sin traslados registrados. Con el botón <strong>Mover</strong> de arriba queda asentado el primero.</p>';
    }
    html += "</div>";

    /* sanidad */
    html += '<div class="card pad stack"><p class="eyebrow">Sanidad</p><div class="kv">' +
      kv("Última vacunación", fmtFecha(h.vacunaFecha)) +
      kv("Coggins", fmtFecha(h.cogginsFecha)) +
      kv("Último herraje", fmtFecha(h.herrajeFecha)) +
      kv("Desparasitación", fmtFecha(h.desparasitacionFecha)) +
      kv("Odontología", fmtFecha(h.odontologiaFecha)) +
      kv("Alta estimada", fmtFecha(h.altaEstimada)) +
    "</div>" + (h.historialClinico ? '<p class="sub" style="white-space:pre-wrap">' + esc(h.historialClinico) + "</p>" : "") + "</div>";

    /* economía */
    html += '<div class="card pad stack cost"><p class="eyebrow">Economía del caballo</p><div class="kv">' +
      kv("Costo de adquisición", money(h.costoMonto, h.costoMoneda)) +
      kv("Gastos acumulados", money(gastoTotalUSD(h), "USD")) +
      kv("Invertido", "<strong>" + money(invertidoUSD(h), "USD") + "</strong>", true) +
      kv("Valuación actual", money(h.valuacion, h.valuacionMoneda)) +
      kv("Suma asegurada", money(h.seguroSuma, h.seguroMoneda)) +
      kv("Ingresos generados", money(ingresoTotalUSD(h), "USD")) +
    "</div>";
    if ((h.gastos || []).length) {
      html += '<div class="scroller"><table><thead><tr><th>Fecha</th><th>Rubro</th><th>Detalle</th><th class="num">Monto</th></tr></thead><tbody>' +
        h.gastos.slice().sort(function (a, b) { return String(b.fecha || "").localeCompare(String(a.fecha || "")); }).map(function (g) {
          return "<tr><td class='tnum'>" + fmtFecha(g.fecha) + "</td><td>" + esc(g.rubro || "—") + "</td><td>" + esc(g.detalle || "") +
            '</td><td class="num">' + money(g.monto, g.moneda) + "</td></tr>";
        }).join("") + "</tbody></table></div>";
    }
    html += "</div>";

    if (h.notas) html += '<div class="card pad stack"><p class="eyebrow">Notas</p><p style="white-space:pre-wrap">' + esc(h.notas) + "</p></div>";
    if (h.estado === "baja") {
      html += '<div class="card pad stack"><p class="eyebrow">Baja</p><div class="kv">' + kv("Fecha", fmtFecha(h.fechaBaja)) + kv("Motivo", h.motivoBaja || "—") + "</div></div>";
    }

    return html + "</section>";
  }

  function kv(k, v, raw) {
    return '<div><div class="k">' + esc(k) + '</div><div class="v">' + (raw ? v : esc(v)) + "</div></div>";
  }

  /* ---------- formulario ---------- */

  function vForm(id) {
    var h = id ? db.horses.filter(function (x) { return x.id === id; })[0] : null;
    if (id && !h) return '<section class="card"><div class="empty"><h3>No encontré ese caballo</h3></div></section>';
    var n = h || { fotos: [], torneos: [], gastos: [], ingresos: [], aptitudes: {} };

    function inp(name, label, val, type, attrs) {
      return '<div class="field"><label for="i-' + name + '">' + esc(label) + '</label><input id="i-' + name + '" name="' + name +
        '" type="' + (type || "text") + '" value="' + esc(val == null ? "" : val) + '" ' + (attrs || "") + "></div>";
    }
    function sel(name, label, opts, val) {
      return '<div class="field"><label for="i-' + name + '">' + esc(label) + '</label><select id="i-' + name + '" name="' + name + '">' +
        opts.map(function (o) {
          var v = typeof o === "string" ? o : o.v, t = typeof o === "string" ? o : o.t;
          return '<option value="' + esc(v) + '"' + (String(val || "") === String(v) ? " selected" : "") + ">" + esc(t) + "</option>";
        }).join("") + "</select></div>";
    }
    function ta(name, label, val) {
      return '<div class="field"><label for="i-' + name + '">' + esc(label) + '</label><textarea id="i-' + name + '" name="' + name + '">' + esc(val || "") + "</textarea></div>";
    }
    function mon(name, label, val, curVal) {
      return '<div class="field"><label for="i-' + name + '">' + esc(label) + '</label><div class="row" style="flex-wrap:nowrap;gap:.3rem">' +
        '<input id="i-' + name + '" name="' + name + '" type="number" step="1" min="0" value="' + esc(val == null ? "" : val) + '" style="flex:1">' +
        '<select name="' + name + 'Moneda" aria-label="Moneda" style="width:5.2rem"><option value="USD"' + (curVal !== "ARS" ? " selected" : "") + ">USD</option>" +
        '<option value="ARS"' + (curVal === "ARS" ? " selected" : "") + ">ARS</option></select></div></div>";
    }

    var html = '<section class="stack"><form id="form" class="stack">' +
      '<div class="h-sec"><div><p class="eyebrow">' + (h ? "Editar ficha" : "Nuevo caballo") + "</p><h2>" + esc(h ? h.nombre : "Cargar un caballo") + "</h2></div>" +
      '<div class="row"><a class="btn" href="' + (h ? "#/caballo/" + h.id : "#/caballos") + '">Cancelar</a>' +
      '<button class="btn primary" type="submit">Guardar</button></div></div>';

    html += '<fieldset class="fs"><legend>Identidad</legend><div class="grid2">' +
      inp("nombre", "Nombre *", n.nombre, "text", "required") +
      inp("apodo", "Sobrenombre", n.apodo) +
      sel("sexo", "Sexo", SEXOS, n.sexo || "Yegua") +
      inp("nacimiento", "Fecha de nacimiento", n.nacimiento, "date") +
      inp("pelaje", "Pelaje y señas", n.pelaje) +
      inp("microchip", "Microchip / n° de marca", n.microchip) +
      inp("criador", "Criador", n.criador) +
      sel("origen", "Origen", ["", "Embrión (cría propia)", "Manada (cría propia)", "Compra de embrión", "Comprado"], n.origen) +
      "</div>" +
      '<div class="field"><label>Fotos</label><div class="photos" id="photos"></div>' +
      '<label class="btn sm" style="cursor:pointer;align-self:flex-start;margin-top:.4rem">+ Agregar fotos<input type="file" id="foto-in" accept="image/*" multiple hidden></label>' +
      '<p class="note">Se achican solas a 620 px para no llenar el espacio. Recomendado: hasta 4 por caballo.</p></div>' +
      '<div class="field"><label>Videos</label><div class="rowset" id="vlist"></div>' +
      '<label class="btn sm" style="cursor:pointer;align-self:flex-start;margin-top:.4rem">+ Agregar video<input type="file" id="video-in" accept="video/*" hidden></label>' +
      '<p class="note">Se pueden filmar directo con el celular. Quedan guardados solo en este dispositivo y no entran en el respaldo exportado. Máximo 100 MB por video.</p></div>' +
      inp("video", "Link a video de juego (YouTube u otro)", n.video, "url") +
      "</fieldset>";

    html += '<fieldset class="fs"><legend>Estado y ubicación</legend><div class="grid2">' +
      sel("estado", "Estado", ESTADOS.map(function (e) { return { v: e.id, t: e.label }; }), n.estado || "juego") +
      sel("reproductivo", "Estado reproductivo (hembras)", [{ v: "", t: "No aplica" }, { v: "vacia", t: "Vacía (V)" }, { v: "prenada", t: "Preñada (P)" }], n.reproductivo) +
      inp("ubicacion", "Ubicación", n.ubicacion, "text", 'list="l-ubic"') +
      inp("petisero", "Petisero a cargo", n.petisero) +
      inp("jinete", "Jinete asignado", n.jinete) +
      inp("altaEstimada", "Alta estimada (si está en recuperación)", n.altaEstimada, "date") +
      "</div><datalist id='l-ubic'>" + ubicaciones().map(function (u) { return '<option value="' + esc(u) + '">'; }).join("") + "</datalist>" +
      '<div class="grid2">' + inp("fechaBaja", "Fecha de baja (venta o fallecimiento)", n.fechaBaja, "date") +
      inp("motivoBaja", "Motivo de la baja", n.motivoBaja) + "</div></fieldset>";

    html += '<fieldset class="fs"><legend>Pedigrí y reproducción</legend><div class="grid2">' +
      inp("padre", "Padre", n.padre, "text", 'list="l-cab"') +
      inp("madre", "Madre", n.madre, "text", 'list="l-cab"') +
      inp("servicio", "Servicio / semen", n.servicio) +
      inp("receptora", "Receptora", n.receptora) +
      inp("fechaParto", "Parto estimado", n.fechaParto, "date") +
      "</div><datalist id='l-cab'>" + db.horses.map(function (x) { return '<option value="' + esc(x.nombre) + '">'; }).join("") + "</datalist>" +
      '<p class="note">Escribí el nombre exacto de la madre o el padre y el sistema arma solo el árbol de crías.</p></fieldset>';

    html += '<fieldset class="fs"><legend>Puntaje físico</legend>' +
      APTITUDES.map(function (a) {
        var v = (n.aptitudes && n.aptitudes[a.id]) || 0;
        return '<div class="slider-row"><label for="a-' + a.id + '" style="font-size:.85rem">' + esc(a.label) + "</label>" +
          '<input id="a-' + a.id + '" name="apt_' + a.id + '" type="range" min="0" max="10" step="1" value="' + v + '" data-apt="' + a.id + '">' +
          '<span class="n" id="av-' + a.id + '">' + (v || "–") + "</span></div>";
      }).join("") +
      ta("observacionesFisicas", "Observaciones", n.observacionesFisicas) + "</fieldset>";

    html += '<fieldset class="fs"><legend>Historial deportivo</legend><div class="rowset" id="torneos"></div>' +
      '<button type="button" class="btn sm" id="add-torneo" style="align-self:flex-start">+ Agregar torneo</button></fieldset>';

    html += '<fieldset class="fs"><legend>Sanidad</legend><div class="grid2">' +
      inp("vacunaFecha", "Última vacunación", n.vacunaFecha, "date") +
      inp("cogginsFecha", "Coggins", n.cogginsFecha, "date") +
      inp("herrajeFecha", "Último herraje", n.herrajeFecha, "date") +
      inp("desparasitacionFecha", "Desparasitación", n.desparasitacionFecha, "date") +
      inp("odontologiaFecha", "Odontología", n.odontologiaFecha, "date") +
      "</div>" + ta("historialClinico", "Historial clínico y lesiones", n.historialClinico) + "</fieldset>";

    html += '<fieldset class="fs"><legend>Economía</legend><div class="grid2">' +
      mon("costoMonto", "Costo de adquisición", n.costoMonto, n.costoMoneda) +
      mon("valuacion", "Valuación actual", n.valuacion, n.valuacionMoneda) +
      mon("precioVenta", "Precio pedido", n.precioVenta, n.precioMoneda) +
      mon("seguroSuma", "Suma asegurada", n.seguroSuma, n.seguroMoneda) +
      "</div>" +
      '<p class="eyebrow" style="margin-top:.4rem">Gastos imputados</p><div class="rowset" id="gastos"></div>' +
      '<button type="button" class="btn sm" id="add-gasto" style="align-self:flex-start">+ Agregar gasto</button>' +
      '<p class="eyebrow" style="margin-top:.6rem">Ingresos</p><div class="rowset" id="ingresos"></div>' +
      '<button type="button" class="btn sm" id="add-ingreso" style="align-self:flex-start">+ Agregar ingreso</button>' +
      "</fieldset>";

    html += '<fieldset class="fs"><legend>Notas</legend>' + ta("notas", "Observaciones generales", n.notas) + "</fieldset>";

    html += '<div class="row"><button class="btn primary" type="submit">Guardar caballo</button>' +
      '<a class="btn" href="' + (h ? "#/caballo/" + h.id : "#/caballos") + '">Cancelar</a><span class="grow"></span>' +
      (h ? '<button class="btn danger" type="button" id="del">Eliminar ficha</button>' : "") + "</div>";

    return html + "</form></section>";
  }

  /* filas dinámicas */
  var draft = { fotos: [], torneos: [], gastos: [], ingresos: [], videosIdb: [] };

  function pintarFotos() {
    var box = $("#photos");
    if (!box) return;
    box.innerHTML = draft.fotos.map(function (f, i) {
      return '<div class="p"><img src="' + f + '" alt="Foto ' + (i + 1) + '"><button type="button" data-rm-foto="' + i + '" aria-label="Quitar foto">×</button></div>';
    }).join("") || '<p class="note">Sin fotos todavía.</p>';
  }

  function pintarVideos() {
    var box = $("#vlist");
    if (!box) return;
    box.innerHTML = draft.videosIdb.map(function (v, i) {
      return '<div class="rw" style="grid-template-columns:1fr auto 2rem">' +
        '<div class="field"><label>Título del video</label><input value="' + esc(v.nombre || "") + '" data-vt="' + i + '"></div>' +
        '<span class="note" style="align-self:center">' + (v.mb ? v.mb + " MB" : "") + "</span>" +
        '<button type="button" class="del" data-rm-v="' + i + '" aria-label="Quitar video">×</button></div>';
    }).join("") || '<p class="note">Sin videos todavía.</p>';
  }

  function pintarTorneos() {
    var box = $("#torneos");
    if (!box) return;
    box.innerHTML = draft.torneos.map(function (t, i) {
      return '<div class="rw"><div class="field"><label>Año</label><input value="' + esc(t.anio || "") + '" data-t="anio" data-i="' + i + '" inputmode="numeric"></div>' +
        '<div class="field"><label>Torneo</label><input value="' + esc(t.torneo || "") + '" data-t="torneo" data-i="' + i + '"></div>' +
        '<div class="field"><label>Jugador</label><input value="' + esc(t.jugador || "") + '" data-t="jugador" data-i="' + i + '"></div>' +
        '<div class="field"><label>Chukkers</label><input value="' + esc(t.chukkers || "") + '" data-t="chukkers" data-i="' + i + '" inputmode="numeric"></div>' +
        '<div class="field"><label>Premio</label><input value="' + esc(t.premio || "") + '" data-t="premio" data-i="' + i + '"></div>' +
        '<button type="button" class="del" data-rm-t="' + i + '" aria-label="Quitar">×</button></div>';
    }).join("") || '<p class="note">Sin torneos cargados.</p>';
  }

  function pintarMovs(kind) {
    var box = $("#" + kind);
    if (!box) return;
    var arr = draft[kind];
    var opts = kind === "gastos" ? RUBROS : ["Venta", "Alquiler de temporada", "Premio", "Venta de embrión", "Servicio", "Otros"];
    box.innerHTML = arr.map(function (g, i) {
      return '<div class="rw"><div class="field"><label>Fecha</label><input type="date" value="' + esc(g.fecha || "") + '" data-g="fecha" data-k="' + kind + '" data-i="' + i + '"></div>' +
        '<div class="field"><label>Rubro</label><select data-g="rubro" data-k="' + kind + '" data-i="' + i + '">' +
        opts.map(function (r) { return '<option' + (g.rubro === r ? " selected" : "") + ">" + esc(r) + "</option>"; }).join("") + "</select></div>" +
        '<div class="field"><label>Detalle</label><input value="' + esc(g.detalle || "") + '" data-g="detalle" data-k="' + kind + '" data-i="' + i + '"></div>' +
        '<div class="field"><label>Monto</label><input type="number" step="1" min="0" value="' + esc(g.monto == null ? "" : g.monto) + '" data-g="monto" data-k="' + kind + '" data-i="' + i + '"></div>' +
        '<div class="field"><label>Moneda</label><select data-g="moneda" data-k="' + kind + '" data-i="' + i + '"><option' + (g.moneda !== "ARS" ? " selected" : "") + '>USD</option><option' + (g.moneda === "ARS" ? " selected" : "") + '>ARS</option></select></div>' +
        '<button type="button" class="del" data-rm-g="' + i + '" data-k="' + kind + '" aria-label="Quitar">×</button></div>';
    }).join("") || '<p class="note">Sin movimientos cargados.</p>';
  }

  /* ============ router ============ */

  function ruta() {
    var h = location.hash.replace(/^#\/?/, "") || "tablero";
    var p = h.split("/");
    return { vista: p[0] || "tablero", id: p[1] || null };
  }

  function render() {
    var r = ruta();
    var app = $("#app");
    var html;

    if (r.vista === "caballo") html = vFicha(r.id);
    else if (r.vista === "nuevo" || r.vista === "editar") html = vForm(r.id);
    else if (r.vista === "corral") html = vCorral();
    else if (r.vista === "caballos") html = vCaballos();
    else if (r.vista === "temporadas") html = vTemporadas();
    else if (r.vista === "temporada") html = vTemporada(r.id);
    else if (r.vista === "armar") html = vPickerCaballos(r.id);
    else if (r.vista === "movimientos") html = vMovimientos();
    else if (r.vista === "crias") html = vCrias();
    else if (r.vista === "sanidad") html = vSanidad();
    else if (r.vista === "finanzas") html = vFinanzas();
    else if (r.vista === "memoria") html = vMemoria();
    else if (r.vista === "datos") html = vDatos();
    else html = vTablero();

    if (!puedeGuardar) {
      html = '<div class="aviso no-print"><strong>Estás viendo una vista previa.</strong> Acá el navegador no deja guardar, ' +
        'así que podés recorrer todo pero los cambios se pierden al cerrar. Para usarlo en serio, abrí el archivo ' +
        '<span class="mono">establo.html</span> con doble clic desde tu computadora.</div>' + html;
    }
    app.innerHTML = html;
    var grupo = { caballo: "caballos", nuevo: "caballos", editar: "caballos", temporada: "temporadas", armar: "temporadas" };
    $$("#tabs a").forEach(function (a) {
      var t = a.getAttribute("href").replace("#/", "");
      a.classList.toggle("on", t === r.vista || t === grupo[r.vista]);
    });
    $$(".cur-toggle button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.cur === ui.cur); });

    if (r.vista === "nuevo" || r.vista === "editar") montarForm(r.id);
    hidratarVideos();
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }

  function montarForm(id) {
    var h = id ? db.horses.filter(function (x) { return x.id === id; })[0] : null;
    draft.fotos = h && h.fotos ? h.fotos.slice() : [];
    draft.torneos = h && h.torneos ? JSON.parse(JSON.stringify(h.torneos)) : [];
    draft.gastos = h && h.gastos ? JSON.parse(JSON.stringify(h.gastos)) : [];
    draft.ingresos = h && h.ingresos ? JSON.parse(JSON.stringify(h.ingresos)) : [];
    draft.videosIdb = h && h.videosIdb ? JSON.parse(JSON.stringify(h.videosIdb)) : [];
    pintarFotos(); pintarVideos(); pintarTorneos(); pintarMovs("gastos"); pintarMovs("ingresos");
  }

  function guardar(form, id) {
    var d = new FormData(form);
    var h = id ? db.horses.filter(function (x) { return x.id === id; })[0] : null;
    var nuevo = h || { id: uid(), creado: hoy(), movimientos: [] };
    var ubicAnterior = h ? (h.ubicacion || "") : "";

    ["nombre", "apodo", "sexo", "nacimiento", "pelaje", "microchip", "criador", "origen", "video",
     "estado", "reproductivo", "ubicacion", "petisero", "jinete", "altaEstimada", "fechaBaja", "motivoBaja",
     "padre", "madre", "servicio", "receptora", "fechaParto",
     "vacunaFecha", "cogginsFecha", "herrajeFecha", "desparasitacionFecha", "odontologiaFecha",
     "historialClinico", "observacionesFisicas", "notas"].forEach(function (k) {
      nuevo[k] = (d.get(k) || "").toString().trim();
    });

    ["costoMonto", "valuacion", "precioVenta", "seguroSuma"].forEach(function (k) {
      var v = d.get(k);
      nuevo[k] = v === "" || v == null ? "" : Number(v);
      var mk = k === "costoMonto" ? "costoMoneda" : k === "precioVenta" ? "precioMoneda" : k === "valuacion" ? "valuacionMoneda" : "seguroMoneda";
      nuevo[mk] = d.get(k + "Moneda") || "USD";
    });

    nuevo.aptitudes = {};
    APTITUDES.forEach(function (a) {
      var v = Number(d.get("apt_" + a.id) || 0);
      if (v > 0) nuevo.aptitudes[a.id] = v;
    });

    nuevo.fotos = draft.fotos.slice();
    nuevo.videosIdb = draft.videosIdb.slice();
    nuevo.torneos = draft.torneos.filter(function (t) { return t.torneo || t.anio; });
    nuevo.gastos = draft.gastos.filter(function (g) { return g.monto; });
    nuevo.ingresos = draft.ingresos.filter(function (g) { return g.monto; });

    if (!nuevo.nombre) { toast("Poné al menos el nombre del caballo."); return null; }

    var choca = db.horses.filter(function (x) { return x.id !== nuevo.id && norm(x.nombre) === norm(nuevo.nombre); })[0];
    if (choca) {
      toast("Ya hay otro caballo llamado " + choca.nombre + ". Poné un nombre distinto: el pedigrí se arma por nombre.");
      return null;
    }

    nuevo.movimientos = nuevo.movimientos || [];
    if (h && nuevo.ubicacion && nuevo.ubicacion !== ubicAnterior) {
      nuevo.movimientos.push({ fecha: hoy(), desde: ubicAnterior, hasta: nuevo.ubicacion, motivo: "Cambio cargado desde la ficha", transporte: "" });
    }

    if (!h) db.horses.push(nuevo);
    save();
    return nuevo;
  }

  /* ============ eventos ============ */

  document.addEventListener("click", function (ev) {
    var t = ev.target;

    var dot = t.closest && t.closest(".dot");
    if (dot) { location.hash = "#/caballo/" + dot.dataset.id; return; }

    var tr = t.closest && t.closest("tr[data-go]");
    if (tr) { location.hash = tr.dataset.go; return; }

    var gal = t.closest && t.closest("[data-gal]");
    if (gal) { ui.galIdx = Number(gal.dataset.gal); render(); return; }

    if (t.id === "seed" || t.id === "seed2") { sembrar(); return; }
    if (t.id === "wipe") {
      if (confirm("Esto borra todas las fichas de este navegador y no se puede deshacer. ¿Exportaste el respaldo?")) {
        db = defaults(); save(); toast("Listo, quedó vacío."); location.hash = "#/tablero"; render();
      }
      return;
    }
    if (t.id === "export") { exportar(); return; }
    if (t.id === "print" || t.id === "print-ficha") { window.print(); return; }
    if (t.id === "f-clear") { ui.filtros = { estado: "", ubicacion: "", sexo: "", incluirBajas: false }; ui.q = ""; $("#q").value = ""; render(); return; }

    if (t.dataset && t.dataset.rmFoto != null) { draft.fotos.splice(Number(t.dataset.rmFoto), 1); pintarFotos(); return; }
    if (t.dataset && t.dataset.rmV != null) { draft.videosIdb.splice(Number(t.dataset.rmV), 1); pintarVideos(); return; }
    if (t.dataset && t.dataset.rmT != null) { draft.torneos.splice(Number(t.dataset.rmT), 1); pintarTorneos(); return; }
    if (t.dataset && t.dataset.rmG != null) { draft[t.dataset.k].splice(Number(t.dataset.rmG), 1); pintarMovs(t.dataset.k); return; }
    if (t.id === "add-torneo") { draft.torneos.push({ anio: new Date().getFullYear() }); pintarTorneos(); return; }
    if (t.id === "add-gasto") { draft.gastos.push({ fecha: hoy(), rubro: RUBROS[0], moneda: "USD" }); pintarMovs("gastos"); return; }
    if (t.id === "add-ingreso") { draft.ingresos.push({ fecha: hoy(), rubro: "Venta", moneda: "USD" }); pintarMovs("ingresos"); return; }

    if (t.id === "del") {
      var r = ruta();
      if (confirm("¿Eliminar la ficha definitivamente? Si el caballo se vendió o falleció, conviene cambiarle el estado a “Fallecida / vendida” en vez de borrarlo.")) {
        db.horses = db.horses.filter(function (x) { return x.id !== r.id; });
        save(); toast("Ficha eliminada."); location.hash = "#/caballos";
      }
      return;
    }

    if (t.dataset && t.dataset.cur) { ui.cur = t.dataset.cur; render(); return; }
    if (t.dataset && t.dataset.modo) { ui.corralModo = t.dataset.modo; render(); return; }

    /* --- movimientos --- */
    if (t.id === "mover") { ui.moviendo = ruta().id; render(); return; }
    if (t.id === "mv-cancel") { ui.moviendo = null; render(); return; }
    if (t.id === "mv-ok") {
      var mh = idHorse(t.dataset.id);
      var destino = ($("#mv-hasta").value || "").trim();
      if (!mh) return;
      if (!destino) { toast("Poné a dónde va el caballo."); $("#mv-hasta").focus(); return; }
      mh.movimientos = mh.movimientos || [];
      mh.movimientos.push({
        fecha: $("#mv-fecha").value || hoy(),
        desde: mh.ubicacion || "",
        hasta: destino,
        motivo: ($("#mv-motivo").value || "").trim(),
        transporte: ($("#mv-transporte").value || "").trim()
      });
      mh.ubicacion = destino;
      save();
      ui.moviendo = null;
      toast(mh.nombre + " ahora figura en " + destino + ".");
      render();
      return;
    }

    /* --- temporadas --- */
    if (t.id === "nueva-temp" || t.id === "nueva-temp2") { ui.editandoTemp = "nueva"; render(); return; }
    if (t.id === "edit-temp") { ui.editandoTemp = ruta().id; render(); return; }
    if (t.id === "tp-cancel") { ui.editandoTemp = null; render(); return; }
    if (t.id === "tp-ok") {
      var esNueva = ui.editandoTemp === "nueva";
      var te = esNueva ? { id: "t" + Date.now().toString(36) + Math.floor(rndId() * 1000), caballos: [] }
                       : db.temporadas.filter(function (x) { return x.id === ui.editandoTemp; })[0];
      if (!te) return;
      var nom = ($("#tp-nombre").value || "").trim();
      if (!nom) { toast("Poné un nombre para la temporada."); $("#tp-nombre").focus(); return; }
      te.nombre = nom;
      te.sede = ($("#tp-sede").value || "").trim();
      te.desde = $("#tp-desde").value || "";
      te.hasta = $("#tp-hasta").value || "";
      te.notas = ($("#tp-notas").value || "").trim();
      if (esNueva) db.temporadas.push(te);
      save();
      ui.editandoTemp = null;
      toast(esNueva ? "Temporada creada. Ahora agregale los caballos." : "Temporada actualizada.");
      if (esNueva) location.hash = "#/temporada/" + te.id; else render();
      return;
    }
    if (t.id === "del-temp") {
      var td = ruta().id;
      if (confirm("¿Eliminar esta temporada? Los caballos no se tocan, solo se borra la lista.")) {
        db.temporadas = db.temporadas.filter(function (x) { return x.id !== td; });
        save(); toast("Temporada eliminada."); location.hash = "#/temporadas";
      }
      return;
    }
    if (t.id === "add-cab") { ui.q = ""; $("#q").value = ""; location.hash = "#/armar/" + ruta().id; return; }
    if (t.dataset && t.dataset.quitar) {
      var tq = db.temporadas.filter(function (x) { return x.id === t.dataset.temp; })[0];
      if (!tq) return;
      tq.caballos = (tq.caballos || []).filter(function (i) { return i !== t.dataset.quitar; });
      save(); render();
      return;
    }
  });

  document.addEventListener("input", function (ev) {
    var t = ev.target;
    if (t.id === "q") {
      ui.q = t.value;
      var r = ruta();
      if (["caballos", "corral", "armar", "movimientos", "memoria"].indexOf(r.vista) === -1) location.hash = "#/caballos";
      else render();
      return;
    }
    if (t.id === "fx") { db.settings.fx = Number(t.value) || 1; save(); render(); $("#fx") && $("#fx").focus(); return; }
    if (t.dataset && t.dataset.apt) { var s = $("#av-" + t.dataset.apt); if (s) s.textContent = t.value === "0" ? "–" : t.value; return; }
    if (t.dataset && t.dataset.vt != null) { draft.videosIdb[Number(t.dataset.vt)].nombre = t.value; return; }
    if (t.dataset && t.dataset.t) { draft.torneos[Number(t.dataset.i)][t.dataset.t] = t.value; return; }
    if (t.dataset && t.dataset.g) { draft[t.dataset.k][Number(t.dataset.i)][t.dataset.g] = t.value; return; }
  });

  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.id === "f-estado") { ui.filtros.estado = t.value; render(); return; }
    if (t.id === "f-ubic") { ui.filtros.ubicacion = t.value; render(); return; }
    if (t.id === "f-sexo") { ui.filtros.sexo = t.value; render(); return; }
    if (t.id === "f-bajas") { ui.filtros.incluirBajas = t.checked; render(); return; }

    if (t.dataset && t.dataset.pick) {
      var tp = db.temporadas.filter(function (x) { return x.id === t.dataset.temp; })[0];
      if (!tp) return;
      tp.caballos = tp.caballos || [];
      if (t.checked) { if (tp.caballos.indexOf(t.dataset.pick) === -1) tp.caballos.push(t.dataset.pick); }
      else { tp.caballos = tp.caballos.filter(function (i) { return i !== t.dataset.pick; }); }
      save();
      return;
    }
    if (t.dataset && t.dataset.g) { draft[t.dataset.k][Number(t.dataset.i)][t.dataset.g] = t.value; return; }

    if (t.id === "video-in") {
      var vf = t.files && t.files[0];
      t.value = "";
      if (!vf) return;
      if (vf.size > 100 * 1024 * 1024) { toast("Ese video pesa más de 100 MB. Filmá uno más corto o recortalo."); return; }
      var vmb = Math.max(1, Math.round(vf.size / 1048576));
      guardarVideoIdb(vf).then(function (k) {
        draft.videosIdb.push({ k: k, nombre: vf.name.replace(/\.[^.]+$/, ""), mb: vmb });
        pintarVideos();
        toast("Video guardado en este dispositivo.");
      }).catch(function () { toast("No pude guardar el video en este navegador."); });
      return;
    }

    if (t.id === "foto-in") {
      var files = Array.prototype.slice.call(t.files || []);
      files.forEach(function (f) {
        leerFoto(f, function (dataUrl) { draft.fotos.push(dataUrl); pintarFotos(); });
      });
      t.value = "";
      return;
    }

    if (t.id === "import") {
      var file = t.files && t.files[0];
      if (!file) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          if (!d || !Array.isArray(d.horses)) throw new Error("formato");
          if (!confirm("Vas a reemplazar las " + db.horses.length + " fichas actuales por las " + d.horses.length + " del archivo. ¿Seguimos?")) return;
          db = { horses: d.horses, settings: d.settings || { fx: 1000, moneda: "USD" }, v: 1 };
          save(); toast("Respaldo importado: " + db.horses.length + " caballos."); render();
        } catch (e) { toast("Ese archivo no parece un respaldo válido."); }
      };
      fr.readAsText(file);
      t.value = "";
    }
  });

  document.addEventListener("submit", function (ev) {
    if (ev.target.id !== "form") return;
    ev.preventDefault();
    var r = ruta();
    var n = guardar(ev.target, r.vista === "editar" ? r.id : null);
    if (n) { toast("Guardado."); location.hash = "#/caballo/" + n.id; render(); }
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "/" && document.activeElement !== $("#q") && !/input|textarea|select/i.test(document.activeElement.tagName)) {
      ev.preventDefault(); $("#q").focus(); $("#q").select();
    }
    if (ev.key === "Escape" && document.activeElement === $("#q")) { $("#q").blur(); }
  });

  /* tooltip del corral */
  var tip = null;
  document.addEventListener("mouseover", function (ev) {
    var d = ev.target.closest && ev.target.closest(".dot");
    if (!d) return;
    tip = $("#tip");
    var p = (d.dataset.tip || "").split("|");
    tip.innerHTML = "<b>" + esc(p[0]) + '</b><br><span class="m">' + esc(p[1]) + "</span><br>" + esc(p[2]) + " · " + esc(p[3]);
    tip.classList.add("on");
    mover(ev);
  });
  document.addEventListener("mousemove", function (ev) { if (tip && tip.classList.contains("on")) mover(ev); });
  document.addEventListener("mouseout", function (ev) {
    if (ev.target.closest && ev.target.closest(".dot") && tip) tip.classList.remove("on");
  });
  function mover(ev) {
    var t = $("#tip");
    var x = Math.min(ev.clientX + 14, window.innerWidth - t.offsetWidth - 10);
    var y = ev.clientY + 16;
    if (y + t.offsetHeight > window.innerHeight) y = ev.clientY - t.offsetHeight - 12;
    t.style.left = x + "px"; t.style.top = y + "px";
  }

  window.addEventListener("hashchange", function () { ui.galIdx = 0; ui.moviendo = null; ui.editandoTemp = null; render(); });

  /* ============ export ============ */

  function exportar() {
    var blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "el-corral-respaldo-" + hoy() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    toast("Respaldo descargado. Guardalo en un lugar seguro.");
  }

          reproductivo: "vacia",
          ubicacion: pick(UBICACIONES),
          petisero: pick(PETISEROS),
          microchip: "985" + ent(100000000, 999999999),
          fotos: [], torneos: [], gastos: [], ingresos: [], movimientos: [], aptitudes: {},
          vacunaFecha: hace(ent(20, 300)),
          herrajeFecha: hace(ent(3, 40)),
          desparasitacionFecha: hace(ent(30, 200)),
          odontologiaFecha: hace(ent(60, 400))
        };

        if (g.estado === "preparacion") { h.sexo = quizas(0.75) ? "Potranca" : "Potrillo"; h.ubicacion = quizas(0.6) ? "Campo Norte" : "Cancha Vieja"; }
        if (g.estado === "vientre") { h.ubicacion = "Haras La Media Luna"; h.petisero = "Haras"; }
        if (g.estado === "juego" && quizas(0.15)) h.sexo = "Castrado";
        if (g.estado === "prestada") { h.ubicacion = "Est. Los Álamos"; h.petisero = "Tercero"; h.tenencia = "Prestado"; }

        /* aptitudes: solo las que ya trabajan */
        if (["competicion", "juego", "recuperacion", "prestada", "retirada"].indexOf(g.estado) > -1) {
          var base = g.estado === "competicion" ? 8 : 6;
          APTITUDES.forEach(function (a) { h.aptitudes[a.id] = Math.min(10, base + ent(-1, 2)); });
        } else if (g.estado === "preparacion" && quizas(0.5)) {
          APTITUDES.forEach(function (a) { h.aptitudes[a.id] = ent(5, 8); });
        }

        /* deportivo */
        if (g.estado === "competicion" || g.estado === "juego" || g.estado === "retirada" || g.estado === "baja") {
          var nt = g.estado === "competicion" ? ent(2, 4) : ent(0, 2);
          for (var t = 0; t < nt; t++) {
            h.torneos.push({
              anio: anio - t - (g.estado === "retirada" || g.estado === "baja" ? 3 : 0),
              torneo: pick(TORNEOS),
              jugador: g.estado === "competicion" ? "Matías" : pick(JINETES),
              chukkers: ent(2, 10),
              premio: quizas(0.18) ? pick(PREMIOS) : ""
            });
          }
          if (g.estado === "competicion") h.jinete = "Matías";
        }

        /* sanidad */
        h.cogginsFecha = hace(ent(10, 195));
        if (g.estado === "recuperacion") {
          h.historialClinico = pick(LESIONES);
          h.altaEstimada = hace(-ent(15, 120));
          h.ubicacion = quizas(0.5) ? "Clínica" : "Campo Sur";
          h.gastos.push({ fecha: hace(ent(5, 60)), rubro: "Veterinaria", detalle: "Estudios y tratamiento", monto: ent(600, 2600), moneda: "USD" });
        }

        /* economía */
        var val = 0;
        if (g.estado === "competicion") val = ent(35, 70) * 1000;
        else if (g.estado === "juego") val = ent(12, 30) * 1000;
        else if (g.estado === "preparacion") val = ent(4, 12) * 1000;
        else if (g.estado === "vientre") val = ent(20, 65) * 1000;
        else if (g.estado === "recuperacion") val = ent(8, 22) * 1000;
        else if (g.estado === "prestada") val = ent(10, 25) * 1000;
        else if (g.estado === "retirada") val = ent(2, 7) * 1000;
        if (g.estado !== "baja") { h.valuacion = val; h.valuacionMoneda = "USD"; }
        if (h.origen === "Comprado" || h.origen === "Compra de embrión") { h.costoMonto = Math.round(val * (0.5 + rnd() * 0.5) / 500) * 500; h.costoMoneda = "USD"; }
        if (val >= 30000 && quizas(0.6)) { h.seguroSuma = Math.round(val * 0.85 / 1000) * 1000; h.seguroMoneda = "USD"; }
        if (g.estado === "competicion" && quizas(0.3)) { h.precioVenta = Math.round(val * 1.2 / 1000) * 1000; h.precioMoneda = "USD"; }

        /* gastos corrientes, cargados en pesos como en el día a día */
        var ng = ent(1, 3);
        for (var q = 0; q < ng; q++) {
          h.gastos.push({
            fecha: hace(ent(5, 180)),
            rubro: pick(["Alimentación", "Herrería", "Veterinaria", "Pensión / campo", "Transporte"]),
            detalle: "",
            monto: ent(40, 320) * 1000,
            moneda: "ARS"
          });
        }

        /* movimientos: historial de traslados */
        var nm = ent(1, 4);
        var lugar = pick(UBICACIONES);
        for (var m = nm; m >= 1; m--) {
          var destino = m === 1 ? h.ubicacion : pick(UBICACIONES);
          if (destino === lugar) destino = pick(UBICACIONES);
          h.movimientos.push({ fecha: hace(m * ent(40, 120)), desde: lugar, hasta: destino, motivo: pick(MOTIVOS), transporte: pick(TRANSPORTES) });
          lugar = destino;
        }

        /* baja */
        if (g.estado === "baja") {
          var vendida = quizas(0.55);
          h.fechaBaja = hace(ent(100, 1400));
          h.motivoBaja = vendida ? "Vendida a " + pick(["un club de Palermo", "un jugador de Estados Unidos", "La Isolina", "un equipo de Inglaterra"]) : pick(["Fallecida — cólico", "Fallecida — accidente en el campo", "Fallecida — vejez"]);
          if (vendida) { h.ingresos.push({ fecha: h.fechaBaja, rubro: "Venta", detalle: "Venta del caballo", monto: ent(15, 55) * 1000, moneda: "USD" }); }
        }

        nuevos.push(h);
      }
    });

    /* --- vientres, preñeces y descendencia --- */
    var vientres = nuevos.filter(function (h) { return h.estado === "vientre" && h.sexo === "Yegua"; });
    var NOMBRES_PADRILLO = ["Sportivo", "Federal"];
    vientres.slice(0, 2).forEach(function (h, k) {
      h.sexo = "Padrillo";
      h.nombre = NOMBRES_PADRILLO[k];
      h.reproductivo = "";
      h.notas = "Padrillo del criadero. Semen congelado disponible.";
      h.valuacion = ent(70, 110) * 1000;
      h.valuacionMoneda = "USD";
      h.torneos = [];
    });
    var padrillos = nuevos.filter(function (h) { return h.sexo === "Padrillo"; });
    var madres = nuevos.filter(function (h) { return h.estado === "vientre" && h.sexo === "Yegua"; });

    madres.forEach(function (h) {
      if (quizas(0.55)) {
        h.reproductivo = "prenada";
        h.fechaParto = hace(-ent(20, 300));
        h.servicio = pick(padrillos).nombre;
        h.receptora = "Receptora " + ent(1, 28);
      }
      h.torneos = [];
      h.notas = h.notas || "Vientre del criadero.";
    });

    /* asignar padres a los jóvenes y a parte de los que juegan */
    function anioDe(h) { return Number(String(h.nacimiento).slice(0, 4)); }
    nuevos.forEach(function (h) {
      if (h.estado === "baja" || h.sexo === "Padrillo") return;
      if (String(h.origen).indexOf("cría propia") === -1) return;
      /* una yegua no puede tener un producto antes de los 4 años */
      var posibles = madres.filter(function (m) { return anioDe(h) - anioDe(m) >= 4; });
      if (quizas(0.7) && posibles.length) {
        h.madre = pick(posibles).nombre;
        h.padre = pick(padrillos).nombre;
        h.criador = "La Media Luna";
      }
    });

    /* --- destacadas: la estrella del establo y sus clones --- */
    var estrella = nuevos[0];
    estrella.nombre = "Lucera";
    estrella.estado = "competicion";
    estrella.jinete = "Matías";
    estrella.apodo = "La Patrona";
    estrella.nacimiento = enFecha(anio - 9, 10, 12);
    estrella.pelaje = "Zaina, lucero";
    estrella.criador = "La Media Luna";
    estrella.origen = "Embrión (cría propia)";
    estrella.ubicacion = "Campo Norte";
    estrella.petisero = "R. Gómez";
    estrella.valuacion = 85000; estrella.valuacionMoneda = "USD";
    estrella.precioVenta = 110000; estrella.precioMoneda = "USD";
    estrella.seguroSuma = 80000; estrella.seguroMoneda = "USD";
    estrella.cogginsFecha = hace(20);
    estrella.vacunaFecha = hace(60);
    estrella.fotos = [FOTO_LUCERA];
    estrella.observacionesFisicas = "Boca excepcional y una recuperación entre chukkers que no se ve seguido. Anda cómoda en cancha pesada y no se apura sola. Es la yegua que Matías juega en los chukkers definitorios.";
    APTITUDES.forEach(function (a) { estrella.aptitudes[a.id] = a.id === "temperamento" ? 9 : 10; });
    estrella.aptitudes.freno = 9;
    estrella.torneos = [
      { anio: anio, torneo: "Abierto de Tortugas", jugador: "Matías", chukkers: 6, premio: "Mejor petisera de la final" },
      { anio: anio, torneo: "Abierto de Hurlingham", jugador: "Matías", chukkers: 8, premio: "" },
      { anio: anio - 1, torneo: "Abierto de Palermo", jugador: "Matías", chukkers: 10, premio: "Mejor petisera del torneo" },
      { anio: anio - 2, torneo: "Abierto del Interior", jugador: "Matías", chukkers: 8, premio: "" }
    ];

    /* dos clones, con la convención real de sufijo */
    [2, 3].forEach(function (nro) {
      var c = nuevos[nro + 20];
      c.nombre = "Lucera B0" + nro;
      c.origen = "Embrión (cría propia)";
      c.criador = "La Media Luna";
      c.madre = ""; c.padre = "";
      c.notas = "Clon de Lucera. Mismo pelaje y las mismas señas.";
      c.pelaje = "Zaina, lucero";
    });

    /* la mejor madre, con producción cargada */
    var reina = madres[0];
    if (reina) {
      reina.nombre = "Salteña";
      reina.apodo = "La Vieja";
      reina.nacimiento = enFecha(anio - 19, 11, 6);
      reina.origen = "Comprado";
      reina.valuacion = 90000; reina.valuacionMoneda = "USD";
      reina.notas = "Base del pie de yeguas. La madre de la mayoría de lo que juega hoy.";
      reina.fotos = [FOTO_SALTENA];
      reina.pelaje = "Alazana";
      nuevos.filter(function (h) {
        return String(h.origen).indexOf("cría propia") > -1 && h.madre && h.estado !== "vientre" && anioDe(h) - anioDe(reina) >= 4;
      }).slice(0, 7).forEach(function (h) { h.madre = "Salteña"; });
    }

    /* tres con el Coggins vencido, para que se vea la alerta al armar la temporada */
    nuevos.filter(function (h) { return h.estado === "competicion"; }).slice(1, 4)
      .forEach(function (h) { h.cogginsFecha = hace(ent(200, 320)); });

    /* el último traslado tiene que terminar donde el caballo está hoy */
    nuevos.forEach(function (h) {
      if (!h.movimientos.length) return;
      var ult = h.movimientos[h.movimientos.length - 1];
      if (ult.hasta !== h.ubicacion) {
        if (ult.desde === h.ubicacion) h.movimientos.pop();
        else ult.hasta = h.ubicacion;
      }
    });

    var vistos = {};
    nuevos.forEach(function (h) {
      var base = h.nombre, n = 2;
      while (vistos[norm(h.nombre)]) { h.nombre = base + " " + n; n++; }
      vistos[norm(h.nombre)] = 1;
    });
    nuevos.forEach(function (h) { db.horses.push(h); });

    /* --- dos temporadas armadas --- */
    var comp = nuevos.filter(function (h) { return h.estado === "competicion"; });
    var jueg = nuevos.filter(function (h) { return h.estado === "juego"; });
    db.temporadas.push({
      id: "t" + Date.now().toString(36) + "a",
      nombre: "Abierto de Tortugas",
      sede: "Tortugas Country Club",
      desde: enFecha(anio, 10, 6),
      hasta: enFecha(anio, 10, 29),
      caballos: comp.concat(jueg.slice(0, 4)).map(function (h) { return h.id; }),
      notas: "Lista tentativa. Falta confirmar el camión y revisar los Coggins vencidos."
    });
    db.temporadas.push({
      id: "t" + Date.now().toString(36) + "b",
      nombre: "Temporada de verano — Uruguay",
      sede: "Punta del Este",
      desde: enFecha(anio + 1, 1, 8),
      hasta: enFecha(anio + 1, 3, 2),
      caballos: jueg.slice(4, 14).map(function (h) { return h.id; }),
      notas: ""
    });

    var guardado = save();
    toast(guardado
      ? "Listo: 100 caballos de muestra y 2 temporadas armadas."
      : "Cargados los 100 caballos, pero acá el navegador no deja guardarlos.");
    if (location.hash === "#/corral") render(); else location.hash = "#/corral";
  }

  /* ============ arranque ============ */

  if (!location.hash) location.hash = "#/tablero";
  render();
  limpiarVideosHuerfanos();
})();
</script>
